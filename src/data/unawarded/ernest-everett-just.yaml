title: Ernest Everett Just
slug: ernest-everett-just
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: Ernest Everett Just built an experimental programme on fertilisation and the biology of the cell surface, was the first recipient of the NAACP's Spingarn Medal in 1915, and - in his host laboratory's own words - was not offered faculty or research positions commensurate with his abilities, which took his research to Europe.
introduction: This entry was opened to test whether institutional exclusion could be established in biology at claim level rather than inferred from an absence of awards. The mechanism was not assigned in advance; the audit decided it.
omission_case: His case matters because the constraint on his career is stated by an institution that hosted his work, in its own record, rather than being reconstructed from the shape of his publication list.
structural_reason: "The Marine Biological Laboratory records that Just, as the only African-American scientist there, faced considerable prejudice in the US academic world; that despite winning prestigious awards he was not offered faculty or research positions commensurate with his abilities; and that with limited opportunities in the US he travelled to Europe, working at the Stazione Zoologica, the Kaiser Wilhelm Institute and the Station Biologique until the war ended that route. What that constraint did to the recognition he received is a separate question, and this entry does not treat the two as the same claim."
