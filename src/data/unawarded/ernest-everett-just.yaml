  rationale:
    impact: His experimental work on the point at which fertilisation begins, and on the egg-cell surface, shaped a line of cell biology that his 1939 monograph set out in full.
    verification: The contribution is anchored to his own monograph and documented by the laboratory where the work was done.
    uniqueness: He worked in direct argument with Lillie and Loeb on the same questions, which bounds the counterfactual claim while leaving his experimental contribution distinct.
    durability: The cell-surface programme was influential and partly anticipatory, though his specific theoretical framework was not adopted wholesale.
    breadth: The benefit is within experimental biology rather than across society.
    attribution: Credit for his published work is consistently his; the constraint documented here concerns positions, not authorship.
    observed_recognition: The first Spingarn Medal in 1915, a doctorate from Chicago, a professorship at Howard and research at three major European institutes, against the documented absence of the US positions his work warranted.
key_facts:
  - fact: "Just published \"The Biology of the Cell Surface\" in 1939, the monograph in which his experimental programme on fertilisation and the egg-cell surface is set out."
    source: 1
  - fact: "The Marine Biological Laboratory records that Just \"enjoyed life at the MBL, but as the only African-American scientist, he faced considerable prejudice in the US academic world\", and that \"despite winning prestigious awards, he was not offered faculty or research positions commensurate with his abilities\"."
    source: 2
  - fact: With limited opportunities in the United States he travelled to Europe, undertaking research at the Stazione Zoologica in Italy, the Kaiser Wilhelm Institute for Biology in Germany and the Station Biologique in France, returning to the US shortly before his death in 1941.
    source: 2
  - fact: He received the first Spingarn Medal, awarded by the NAACP in 1915.
    source: 3
analysis:
  - heading: A constraint on positions, stated by an institution
    body: "The claim at the centre of this entry is not that a prize was withheld. It is that the positions through which a scientific career normally accumulates visibility were not offered, and that this is recorded by the laboratory where he worked rather than inferred by us. That is what the published definition of institutional exclusion requires: formal barriers to appointments constraining the visibility from which honours are usually derived."
  - heading: What the audit did not conclude
    body: "The audit tags the mechanism as documented in the case. It does not claim to have measured how much of his recognition gap the mechanism produced, and it does not treat his European research as evidence of exclusion in itself - working abroad is ordinary in science. The documented element is the absence of commensurate US positions, and that is the element the tag rests on."
