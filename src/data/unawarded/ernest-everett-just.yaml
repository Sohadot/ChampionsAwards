audit_exceptions:
  - claim: attribution
    search_date: '2026-09-11'
    search_note: "Sought a record-grade source apportioning credit between Just and his collaborators, particularly Frank Lillie. His monograph and the MBL record document his work and his role; no document settling the credit question was found, and none is needed - no competing claim is made in this entry."
    best_source: 2
    reason: Secondary-record-sufficient. The entry claims authorship of his published programme, which the monograph itself establishes.
  - claim: observed-recognition
    search_date: '2026-09-11'
    search_note: "Sought an NAACP record of the 1915 Spingarn Medal. The organisation's current pages for the medal did not resolve; the award and his primacy as its first recipient are documented in reference works."
    best_source: 3
    reason: Secondary-record-sufficient for the award; the constraint side of the recognition record is anchored institutionally.
mechanism_audit:
  search_date: '2026-09-11'
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - recognition-bias
  finding: mechanism-evidenced
  note: >-
    Institutional exclusion is evidenced, and by an institution rather than by inference: the Marine
    Biological Laboratory's own record states that despite winning prestigious awards he was not
    offered faculty or research positions commensurate with his abilities, and that limited
    opportunities in the United States took his research to Europe. That matches the mechanism's
    published definition, which turns on formal barriers to positions constraining the visibility from
    which honours are derived. Credit misattribution was tested and is not supported: his published
    work is attributed to him throughout. Gatekeeping is not supported - no act obstructing publication
    or dissemination is documented in the sources consulted. Delayed recognition does not fit: he was
    recognised in his own time, most visibly by the first Spingarn Medal in 1915. No claim is made
    about how much of the measured gap the exclusion produced; the mechanism is documented in the case,
    and the causal share is not.
  best_sources: [1, 2]
