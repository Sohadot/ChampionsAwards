analysis:
  - heading: Caution as a recognition filter
    body: "Avery's gap illustrates how a prize's own conservatism can act as a filter: a result that later proved pivotal was treated cautiously in its moment, and the window for recognition closed. The case is a reminder that being early and correct is not sufficient when the receiving institution is slow to accept a paradigm shift."
