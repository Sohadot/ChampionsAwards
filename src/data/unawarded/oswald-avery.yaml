title: Oswald Avery
slug: oswald-avery
status: published
last_reviewed: 2026-09-09
summary: Oswald Avery and his colleagues provided key evidence in 1944 that DNA is the material of heredity, a result central to molecular biology, yet Avery never received a Nobel Prize.
introduction: Avery's case is often cited because the identification of DNA as the carrier of genetic information was among the most consequential results of twentieth-century biology, and it went unrecognised by the Nobel committees.
omission_case: His case matters because a finding that reoriented biology toward DNA was not honoured by the era's leading prize, illustrating how caution and disciplinary framing can delay or block recognition.
structural_reason: Recognition was shaped by contemporary scepticism about the result, by the framing of the work within bacteriology, and by the conservatism of prize deliberations.
