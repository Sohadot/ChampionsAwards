  rationale:
    impact: The 1944 experiment identified a deoxyribonucleic acid fraction as the transforming principle, redirecting attention to DNA as the hereditary material.
    verification: The contribution is anchored to the primary publication in the Journal of Experimental Medicine.
    uniqueness: The experimental identification was distinctive, though it extended an existing research programme on pneumococcal transformation.
    durability: The centrality of DNA to heredity is a settled foundation of biology.
    breadth: Molecular biology's downstream benefits are wide.
    attribution: Credit for the experiment is consistently assigned to Avery, MacLeod and McCarty in the record.
    observed_recognition: Scientific credit is secure and the experiment is eponymous, while the era's leading prize was never awarded to him despite 38 recorded nominations. Unchanged by the 2026-09-11 requalification - the new evidence documents the non-award more precisely without changing how much recognition he received.
key_facts:
  - fact: "Avery, MacLeod and McCarty published \"Studies on the chemical nature of the substance inducing transformation of pneumococcal types\" in the Journal of Experimental Medicine in 1944."
    source: 2
  - fact: The Nobel nomination archive records Oswald Theodore Avery as a nominee in 38 nominations - 37 for Physiology or Medicine between 1932 and 1953, and one for Chemistry in 1957, two years after his death in 1955.
    source: 3
  - fact: The Nobel nomination archive currently publishes nominations for Physiology or Medicine only through 1953, so nominations after that year cannot be checked.
    source: 4
analysis:
  - heading: A documented non-award, without a documented reason
    body: "Avery's record is unusual in this corpus: the absence of an award is not an inference from silence but a fact visible in the awarding institution's own archive, alongside 38 nominations across two decades. What that archive does not contain is a reason. The committee's evaluations are not published, and the Physiology or Medicine nominations are currently open only through 1953. This entry once explained the outcome by the prize's conservatism; that explanation is withdrawn, and nothing replaces it, because nothing in the available record supports one."
