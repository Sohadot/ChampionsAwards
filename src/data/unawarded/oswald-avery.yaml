title: Oswald Avery
slug: oswald-avery
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: Oswald Avery, Colin MacLeod and Maclyn McCarty published evidence in 1944 that a deoxyribonucleic acid fraction carried the transforming principle in pneumococcus, and the Nobel nomination archive records Avery as a nominee in 38 nominations without an award.
introduction: Avery's case pairs a primary publication with an unusually complete institutional record of non-award - the nomination archive documents who nominated him and when, across two decades.
omission_case: His case matters because the recognition record is documented on both sides. The contribution is anchored to the 1944 paper; the absence of an award is anchored to the awarding institution's own nomination archive rather than inferred from silence.
structural_reason: "The record establishes what happened, not why. Avery was nominated repeatedly between 1932 and 1953 and was never awarded. This entry previously attributed the outcome to the conservatism of prize deliberations and to disciplinary framing; those claims are withdrawn. The committee's evaluations are not published, and the nomination archive for Physiology or Medicine is currently open only through 1953, so no record available to this audit establishes the reasons for any decision."
