    impact: Her rotation-curve observations provided decisive evidence for dark matter.
    verification: The work and its reception are well documented.
    uniqueness: The observational program was distinctive, building on and extending prior hints.
    durability: Dark matter remains central to cosmology.
    breadth: The benefit is scientific and broad within astrophysics and cosmology.
    attribution: Credit is clearly and consistently assigned to her.
    observed_recognition: She received the National Medal of Science and the RAS Gold Medal, though not a Nobel Prize.
key_facts:
  - fact: Rubin's galaxy-rotation observations provided decisive evidence for the existence of dark matter.
    source: 1
  - fact: She received the National Medal of Science (1993) and was the first woman awarded the Royal Astronomical Society's Gold Medal since 1828.
    source: 2
analysis:
  - heading: A control case for the index
    body: "Rubin is included precisely because her recognition was substantial. A transformative contribution that was broadly honoured should show a modest gap, and if the index instead forced a large one, that would signal a bias in the method. Her moderate gap is evidence the instrument is measuring, not editorialising."
