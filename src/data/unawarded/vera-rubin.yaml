title: Vera Rubin
slug: vera-rubin
status: published
last_reviewed: 2026-09-09
domain: physics-astronomy
summary: Vera Rubin's observations of galaxy rotation provided decisive evidence for dark matter, and she received major honours including the National Medal of Science and the Royal Astronomical Society's Gold Medal, though never a Nobel Prize.
introduction: Rubin's work transformed cosmology, and she was widely honoured during her lifetime, which makes her a deliberate high-recognition case for testing whether assessed merit and recognition can align closely.
omission_case: Her case matters as a control on the archive - a contribution of the first rank that was substantially recognised, so its recognition gap is expected to be modest rather than extreme.
structural_reason: Where a gap remains, it reflects the absence of the field's single highest honour rather than any broad failure of recognition, which was in her case substantial and sustained.
