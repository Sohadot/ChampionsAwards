key_facts:
- fact: Rubin's galaxy-rotation observations provided decisive evidence for the existence of dark matter.
  source: 1
- fact: She received the National Medal of Science (1993) and was the first woman awarded the Royal Astronomical Society's Gold Medal since 1828.
  source: 2
- fact: She was denied the use of the Hale telescope at Palomar because women were not allowed access until the 1960s, and in 1965 became the first woman officially invited to observe there.
  source: 3
- fact: "In her own account she records being invited to use a Carnegie telescope at Palomar that was \"still not available to women\", first observing there in December 1965, and describes the single men's toilet as the facility \"that kept women from observing at Palomar for decades\"."
  source: 4
