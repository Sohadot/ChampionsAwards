mechanism_audit:
  search_date: '2026-09-10'
  considered:
  - institutional-exclusion
  - credit-misattribution
  - institutional-gatekeeping
  - delayed-recognition
  - theory-experiment-asymmetry
  - recognition-bias
  finding: mechanism-evidenced
  note: >-
    Institutional exclusion is supported by the record: access to the 200-inch Hale telescope at
    Palomar - the instrument through which observational standing in this field was built - was closed
    to women until the 1960s, and her admission in 1965 is recorded as a first. The National Academy of
    Sciences memoir states the denial directly, her own institution records the 1965 admission, and her
    own published account records the invitation to a telescope "still not available to women". One
    further editorial episode was found and deliberately not tagged: she records an Astronomical Journal
    editor saying he would not publish her students' names, and relenting when she offered to withdraw
    the paper. An attempt that was withdrawn did not shape the record, so it does not evidence
    gatekeeping; it is noted here rather than counted.
    Credit misattribution was tested and does not hold: attribution of the rotation-curve work to her is
    consistent across the record. Gatekeeping, delayed recognition and theory-experiment asymmetry were
    tested and are not supported. Tagging this mechanism does not imply it produced her measured gap,
    which is the smallest in this corpus; the mechanism is documented in the case, and her recognition
    was nonetheless substantial. No score was changed by this audit.
  best_sources:
  - 2
  - 3
analysis:
- heading: A control case for the index
  body: Rubin is included precisely because her recognition was substantial. A transformative contribution that was broadly honoured should show a modest gap, and if the index instead forced a large one, that would signal a bias in the method. Her moderate gap is evidence the instrument is measuring, not editorialising.
