title: Gregor Mendel
slug: gregor-mendel
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: Gregor Mendel published his experiments on inheritance in pea plants in 1866, and the principles they established entered general scientific use only after three botanists independently rediscovered the work in 1900.
introduction: Mendel's case records a measured interval between a published contribution and its uptake by the wider scientific community. The interval is documented; the reasons for it are contested in the historical literature and are not asserted here.
omission_case: His case matters because the delay is precisely datable from the published record - a paper in 1866, independent rediscoveries in 1900 - which makes it a clean test of what a recognition gap looks like when no rival claimant is disputing credit.
structural_reason: "What the record establishes is the interval itself: the paper was published in 1866 and the principles were rediscovered independently in 1900. Why the interval occurred is not established here. Explanations commonly offered - that the community was unprepared for a quantitative treatment of inheritance, or that his position outside a major research centre limited circulation - are historiographical hypotheses, and this entry previously asserted them as fact. They are withdrawn pending evidence that distinguishes them from the bare fact of the delay."
