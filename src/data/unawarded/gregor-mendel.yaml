title: Gregor Mendel
slug: gregor-mendel
status: published
last_reviewed: 2026-09-09
summary: Gregor Mendel established the basic laws of inheritance through his experiments with pea plants, but his work was largely overlooked for decades until its rediscovery around 1900, long after its publication.
introduction: Mendel's case is a classic example of delayed recognition, where foundational work sat unread by the wider scientific community until independent researchers rediscovered it at the turn of the century.
omission_case: His case matters because the delay was not a failure of the work but of the recognition system, which lacked the channels and readiness to absorb an unfamiliar result from outside its established centres.
structural_reason: Recognition was shaped by Mendel's position outside major research institutions and by a scientific community not yet primed to interpret the significance of his statistical approach.
