analysis:
  - heading: When the system is not ready to receive the work
    body: "Mendel's gap is a story about timing and channels rather than contested credit. The recognition architecture of his era had no ready place for a quantitative result from a peripheral position, so the work waited for a community that could read it - a reminder that recognition depends on the receiver as much as the contribution."
