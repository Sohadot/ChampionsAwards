  finding: mechanism-evidenced
  note: >-
    Delayed recognition is evidenced as an interval: publication in 1866, independent rediscovery in
    1900, with no rival claimant contesting credit - which is what the published definition of this
    mechanism requires. Two caveats are recorded rather than hidden. First, this entry previously
    asserted causes for the interval (an unprepared community, a peripheral institutional position);
    those are withdrawn, because nothing in the record distinguishes them from the bare fact of the
    delay. Second, the mechanism itself sits close to a description of the outcome it explains, which
    is a weakness in the ontology rather than in this case; it is flagged here for the concept review.
    Credit misattribution does not hold - no rival claimant. Institutional exclusion and gatekeeping
    were tested: no formal barrier or act of obstruction is documented in the sources consulted.
