  rationale:
    impact: The principles set out in the 1866 paper are foundational to genetics.
    verification: The contribution is anchored to the primary publication, and three botanists independently rediscovered the same principles in 1900 - independent confirmation of an unusually direct kind.
    uniqueness: The systematic quantitative treatment of hybrid ratios was distinctive for its time.
    durability: Mendelian inheritance remains a pillar of biology.
    breadth: Genetics underpins wide areas of science and medicine.
    attribution: Credit is unambiguously his in the modern record; it arrived decades after publication.
    observed_recognition: He received no recognition in his lifetime for this work, but posthumous recognition is close to total - the laws and the field carry his name. Calibrated against comparable eponymous-but-unawarded cases in this corpus, this is high recognition arriving late, not absent recognition. Raised from 40 in the 2026-09-11 requalification.
key_facts:
  - fact: Mendel's experiments on pea hybrids were published in 1866 as "Versuche ueber Pflanzen-Hybriden" in the Verhandlungen des naturforschenden Vereines in Bruenn, volume IV, pages 3-47.
    source: 1
  - fact: Three botanists - Hugo de Vries, Carl Correns and Erich von Tschermak - independently rediscovered Mendel's work in 1900, a generation after he published.
    source: 3
analysis:
  - heading: A dated interval, without an explanation attached
    body: "Mendel's is the cleanest recognition gap in this corpus to measure and the hardest to explain. Both endpoints are documented - publication in 1866, independent rediscovery in 1900 - and no rival claimant contested the credit. What produced the interval is a live question in the history of science, and this entry deliberately stops at the measurement. A gap whose cause is unknown is still a gap; calling it 'a community that was not ready' would be an explanation the record here does not carry."
