  rationale:
    impact: "Two separate contributions, each infrastructural: the out-of-order dynamic instruction scheduling proposed on the IBM supercomputer project in 1965, and the scalable design rules and design methodology that made chip design teachable and separable from fabrication."
    verification: "The VLSI work is anchored to her own technical report from the laboratory where it was done, and to two institutions that honoured it. The 1965 contribution is anchored to an academic history project that dates it and cites her internal memorandum, not to the company's own record, and the score is held below the corpus's best-verified cases for that reason."
    uniqueness: "The museum that elected her a Fellow credits her with inventing scalable design rules and names her principal author of the textbook. The textbook is jointly authored and the hall of fame records the induction as shared with her co-author, so the methodology is not scored as solely hers."
    durability: "Out-of-order execution is standard in high-performance processors, and the design methodology became the basis of a curriculum: her own report records courses at about twelve universities in 1979-80 and more than eighty the following year."
    breadth: The benefit reaches anyone who uses a processor or an integrated circuit rather than a research community only.
    attribution: "Credit today is clear and is partly eponymous in the pairing that names the methodology after her and her co-author. It is scored well below the corpus's strongest attribution cases for a specific reason: the 1965 contribution entered the public record through a later academic history project rather than through the contemporaneous record of the project on which it was made."
    observed_recognition: "Five honours are documented here and all fall between 2009 and 2023 - a professional society's pioneer award, a museum fellowship, an international medal, her former employer's lifetime achievement award delivered with an apology, and induction into a national hall of fame. That is recognition across independent systems without the single highest award of the field. This score sits on the boundary of the corpus's under-recognition band, so the case's classification turns on it; it is stated here plainly rather than adjusted away from the edge."
key_facts:
  - fact: "An academic history of the IBM Advanced Computing Systems project records that dynamic instruction scheduling concepts were presented by Lynn Conway late in 1965, and lists her internal document \"Dynamic Instruction Scheduling\" dated 23 February 1966."
    source: 4
  - fact: "The Computer History Museum states that IBM fired her as she underwent gender transition in 1968, that she was recruited to Xerox PARC in 1973, that she invented scalable design rules for VLSI chip design, and that she became principal author of the Mead-Conway text Introduction to VLSI Systems."
    source: 2
  - fact: "In her own Xerox PARC report she records the spread of the methodology: courses were offered at about twelve universities in the 1979-80 school year and at more than eighty universities in 1980-81."
    source: 1
  - fact: The National Inventors Hall of Fame inducted her in 2023 for very large-scale integration, jointly with Carver Mead, and records her earlier contributions to computer architecture at IBM Research including multiple-out-of-order dynamic instruction scheduling.
    source: 3
  - fact: "The professional society's magazine records the IEEE Computer Society Computer Pioneer Award in 2009, the IEEE/RSE James Clerk Maxwell Medal in 2015, her arrival at Xerox PARC in 1975, the publication of the textbook in 1980, her Michigan professorship from 1985 until she retired in 1998, and the company's apology for the termination in 2020."
    source: 5
  - fact: The Computer History Museum elected her a Fellow in 2014 for her work in developing and disseminating new methods of integrated circuit design.
    source: 2
analysis:
  - heading: The barrier is documented; the quantity is not
    body: "Two institutions that honoured her state the dismissal and its reason, which is a stronger evidentiary position than most exclusion cases in this corpus enjoy, and stronger than inferring a barrier from a thin record of honours. What no source establishes is the counterfactual - what her recognition record would have been without it. This entry therefore tags the mechanism and declines the arithmetic. A mechanism can be real, documented and consequential without the corpus being able to say how many points of recognition it cost."
  - heading: Why delayed recognition is not the mechanism here
    body: "The honours arrived between 2009 and 2023 for work done between 1965 and 1980, which invites the delayed-recognition label. The definition does not fit. That mechanism describes a community unable to absorb a contribution, and the contribution here was absorbed almost immediately: her own report records the methodology spreading from about twelve university courses to more than eighty within a single year. The work was not waiting for the field to catch up. What arrived late was the honouring of its author, which is a different thing, and the entry does not relabel one as the other."
  - heading: What the mechanism audit did not find
    body: "Credit misattribution was tested and is not tagged. No source in this audit names another person who received the reward for her work, and the methodology carries her name alongside her co-author's. The absence of contemporaneous public attribution for the 1965 contribution is recorded as an attribution weakness in the score rather than as displacement toward a named beneficiary, because displacement is what that mechanism requires and it is not in the record."
