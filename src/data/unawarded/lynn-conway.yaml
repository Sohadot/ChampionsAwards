audit_exceptions:
  - claim: pattern:institutional-exclusion
    search_date: '2026-09-12'
    search_note: "Sought the company's own record of the 1968 termination and of the 2020 apology. No statement published by the company was reached; the apology was delivered at an internal event and is reported rather than published. The university pages that carry her departmental record, and the site she maintained there, returned HTTP 403 or were unreachable to this audit. The dismissal and its stated reason are documented consistently by the museum that elected her a Fellow and by the professional society's magazine."
    best_source: 2
    reason: "Secondary-record-sufficient, and stated as such. The barrier is documented by two bodies that honoured her rather than by the employer that imposed it, and the entry claims the event, not a quantified effect of it."
  - claim: attribution
    search_date: '2026-09-12'
    search_note: "Sought a record-grade source establishing whether and for how long the 1965 contribution went publicly unattributed to her. The academic history of the project dates the contribution to her and cites her internal memorandum, but no source read here documents the attribution history itself."
    best_source: 4
    reason: "Known-status. The attribution score is lowered on what is documented - that the contribution entered the public record through a later history project - and the entry makes no claim about a period of suppression it did not read a source for."
  - claim: observed-recognition
    search_date: '2026-09-12'
    search_note: "Her membership of the National Academy of Engineering is widely reported, with 1989 given as the election year. No academy page recording it was reached by this audit, so it is not listed among the honours above and does not carry the score."
    best_source: 3
    reason: Excluded rather than asserted. The observed-recognition score rests on the five honours documented by sources read here.
mechanism_audit:
  search_date: '2026-09-12'
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: mechanism-evidenced
  note: >-
    Institutional exclusion is evidenced as a formal barrier to a position: the museum that elected her
    a Fellow and the professional society's magazine both record that the company terminated her
    employment in 1968 as she underwent gender transition, and the same society's magazine records the
    company's apology in 2020. The mechanism is tagged for the event and not for any quantity derived
    from it. Credit misattribution was tested and is not tagged, because no named person is documented
    as receiving the reward for her work. Delayed recognition was tested and is not tagged, because its
    definition turns on a community's inability to absorb the contribution, and her own report documents
    the methodology spreading to more than eighty university courses within two years of the textbook.
    Institutional gatekeeping requires an actor controlling publication or access and obstructing it;
    no such actor is in the record. Posthumous recognition does not apply, since the documented honours
    were all received in her lifetime. The theory-experiment asymmetry has no purchase on this case.
  best_sources: [1, 2, 4]
