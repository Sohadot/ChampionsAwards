title: Lynn Conway
slug: lynn-conway
status: published
last_reviewed: 2026-09-12
domain: mathematics-computing
subfield: computing
summary: Lynn Conway proposed dynamic instruction scheduling at IBM in 1965, was dismissed by the company in 1968 as she underwent gender transition, rebuilt a career at Xerox PARC where she created scalable design rules and the VLSI design methodology that reorganised chip design, and received her documented honours between 2009 and 2023.
introduction: This entry keeps three things apart that a summary of her life usually merges - what she contributed, what is documented about her dismissal, and how much recognition she received - because the corpus can establish each separately and cannot establish a causal quantity linking them.
omission_case: "Her case matters because it is the clearest test in this corpus of whether a documented employment exclusion can be held apart from a recognition outcome. The dismissal is not inferred from an absence of honours; it is stated by the institutions that later honoured her. What remains unestablished, and is treated as unestablished here, is how much of the shape of her recognition record follows from it."
structural_reason: "The documented barrier is a termination of employment. The Computer History Museum, which elected her a Fellow, states that IBM fired her as she underwent gender transition in 1968; the professional society's magazine reports the same event and the company's apology in 2020, delivered with a lifetime achievement award. That is the published definition of institutional exclusion in this corpus - a formal barrier to a position, constraining the visibility from which honours follow. It is not a claim that the size of her recognition gap has been derived from the dismissal. The corpus establishes the barrier, and separately measures the recognition; it does not compute the second from the first."
