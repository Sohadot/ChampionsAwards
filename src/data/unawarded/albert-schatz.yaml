  rationale:
    impact: Streptomycin was the first antibiotic effective against tuberculosis, as the awarding institution's own citation states.
    verification: The contribution is anchored to the primary publication, the co-discovery to an archival legal record, and the award outcome to the awarding institution.
    uniqueness: The isolation came out of a systematic screening programme rather than a single unrepeatable insight, which bounds the counterfactual claim.
    durability: The role of streptomycin in the treatment of tuberculosis is historically settled.
    breadth: The benefit reached tuberculosis patients worldwide.
    attribution: Attribution was contested to the point of litigation, and the settlement records co-discovery that the award did not reflect.
    observed_recognition: First authorship and legally recorded co-discovery, against exclusion from the field's highest award, which was given in full to his supervisor.
key_facts:
  - fact: "Schatz, Bugie and Waksman published \"Streptomycin, a substance exhibiting antibiotic activity against gram-positive and gram-negative bacteria\" in 1944, with Schatz as first author."
    source: 1
  - fact: "The Rutgers archival finding aid for the Waksman Papers records a civil action stipulation, docket C-1261-49, Schatz v. Waksman, \"stating that Schatz and Waksman were co-discovers of the drug Streptomycin and charges Waksman as representing himself as the sole discoverer\", alongside a 1950 complaint against the Rutgers Research and Endowment Foundation."
    source: 2
  - fact: "Nomination 84-0 for the 1952 Nobel Prize in Physiology or Medicine, submitted by Jevrem Nedelkovitch, named three nominees - Elisabeth Bugie, Albert Schatz and Selman A. Waksman."
    source: 3
  - fact: The 1952 Nobel Prize in Physiology or Medicine was awarded to Selman Abraham Waksman alone, with a prize share of 1/1, "for his discovery of streptomycin, the first antibiotic effective against tuberculosis".
    source: 4
  - fact: Rutgers records the discovery as having been made by Waksman and his graduate student Albert Schatz, and the 1952 Nobel Prize as having gone to Waksman.
    source: 5
analysis:
  - heading: Three record layers over one outcome
    body: "Most recognition-gap cases rest on one kind of evidence. This one has three that can be checked against each other: a primary paper naming Schatz first; a court record, held in the archive of the institution where the work was done, in which co-discovery is stipulated; and the awarding institution's own archive, which shows both that a nominator proposed the prize to all three authors in the award year and that the prize was given to one of them in full. The three layers agree about what happened. None of them says why."
  - heading: What the archive shows about the patent, and why it is not tagged
    body: "The same finding aid records that Schatz signed the patent application after being told his name would otherwise be removed from it. That is a documented episode about assignment of rights, not about the dissemination of the work, so it is recorded here and is not counted as institutional gatekeeping, whose published definition turns on preventing or slowing dissemination."
