mechanism_audit:
  search_date: '2026-09-11'
  ontology_revision: MOR-003
  revision_basis: >-
    Audit performed at commit 60e148d (2026-09-11), when MOR-003 was the revision in force. The
    considered list was later pruned at commit 005a421 (MOR-004) to remove concepts that had ceased
    to be audit-eligible; that edit removed candidates, it did not test any new one, so the audit
    remains an MOR-003 audit.
  considered:
    - credit-misattribution
    - institutional-gatekeeping
    - institutional-exclusion
    - delayed-recognition
    - posthumous-recognition
  incomplete_at_revision:
    - theory-experiment-asymmetry
  finding: mechanism-evidenced
  note: >-
    Credit misattribution is evidenced by records rather than by recollection: first authorship on the
    1944 paper, an archived civil action stipulating co-discovery and charging the senior author with
    representing himself as sole discoverer, a 1952 nomination naming all three authors, and an award
    given in full to the senior author. The mechanism's published definition - reward displaced toward
    the more senior or institutionally central figure - is met on the face of these documents.
    Institutional gatekeeping was tested against the archived patent episode and not tagged: that
    concerns assignment of rights, not dissemination. Institutional exclusion does not hold - he held a
    doctoral position at the institution where the work was done. Delayed recognition does not hold:
    what the record shows is a contested credit, not a quiet interval. No claim is made about the
    committee's reasons, which are not published.
  best_sources: [2, 3]
