title: Albert Schatz
slug: albert-schatz
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: Albert Schatz was first author of the 1944 paper reporting streptomycin, was named a co-discoverer in a 1950 civil action settled with his supervisor and Rutgers, and was excluded from the 1952 Nobel Prize that went to Selman Waksman alone - with a 1952 nomination on record that named all three authors.
introduction: This case is unusual in the corpus because three independent record layers can be laid over one another - the primary publication, an archival legal record of co-discovery, and the awarding institution's own nomination and award record.
omission_case: His case matters because the divergence between contribution and award is documented at every step by records made at the time, so nothing here depends on a later narrative about who deserved what.
structural_reason: "The records establish a sequence, not a motive. Schatz was first author of the 1944 paper; a 1950 civil action stipulation in the Rutgers archive states that Schatz and Waksman were co-discoverers of streptomycin and charges Waksman with representing himself as the sole discoverer; a 1952 nomination in the Nobel archive named Bugie, Schatz and Waksman together; and the 1952 prize was awarded to Waksman alone. Why the committee awarded as it did is not published and is not claimed here."
