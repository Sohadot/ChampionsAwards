analysis:
- heading: Priority lost between prediction and detection
  body: Alpher's gap turns on a seam the recognition system handles poorly - the distance between predicting a phenomenon and later detecting it. Because the 1960s detection was celebrated without connecting it to the earlier quantitative prediction, predictive priority dissolved, and the multi-author origin was compressed onto a more famous name.
