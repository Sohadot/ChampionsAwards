summary: Ralph Alpher, with Robert Herman, predicted the cosmic microwave background radiation in 1948, yet the prediction was widely overlooked and often folded into the reputation of his supervisor George Gamow.
introduction: Alpher's doctoral work produced one of the most consequential predictions in cosmology, but the recognition architecture routed credit toward more established names and did not connect his prediction to the later observational discovery.
omission_case: His case matters because a specific, quantitative prediction of the background radiation preceded its 1960s detection, yet that predictive priority was not reflected when the discovery was celebrated.
structural_reason: Recognition was shaped by the visibility of senior collaborators, the gap between a theoretical prediction and its later experimental confirmation, and the tendency of accounts to compress multi-author work onto a single famous name.
