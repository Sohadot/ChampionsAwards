analysis:
  - heading: Creating a tool versus wielding it
    body: "Leavitt's large recognition gap reflects a specific mechanism: the person who forges an enabling instrument is often eclipsed by those who make headline measurements with it. Her relation is invoked constantly in cosmology, while her name is far less visible than the discoveries it made possible."
