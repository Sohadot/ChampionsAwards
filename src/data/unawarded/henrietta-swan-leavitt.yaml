title: Henrietta Swan Leavitt
slug: henrietta-swan-leavitt
status: published
last_reviewed: 2026-09-09
summary: Henrietta Swan Leavitt discovered the period-luminosity relation for Cepheid variable stars, which became a foundational tool for measuring cosmic distances, yet her recognition during her lifetime remained limited.
introduction: Leavitt's relation gave astronomy its first reliable standard candle, underpinning later measurements of the scale of the universe, while her institutional position as a computer at Harvard constrained her recognition.
omission_case: Her case matters because a result that enabled the measurement of galactic distances was produced from a role with little formal scientific standing at the time.
structural_reason: Recognition was shaped by the limited roles available to women in early twentieth-century astronomy and by the tendency to credit those who applied a tool over those who created it.
