  rationale:
    impact: "The essay introduced the potential function and the results now called Green's theorem and Green's functions, which the university describes as underlying its later use across physics and which the Abbey records as used in modern nuclear and solid-state physics."
    verification: "Anchored to the text itself and to two institutions. The one qualification the entry keeps: the accessible text is a transcription made from the 1850s journal reprint rather than from a copy of the 1828 Nottingham printing, and the score is held a little below the corpus's best-verified cases for that."
    uniqueness: "The method and the potential function were his, produced by a man with a year of schooling working outside any scientific institution, and no competing claimant appears anywhere in the record. Kelvin's role was to find the work, not to reach it independently."
    durability: "The highest durability score in this corpus. Green's functions, Green's theorem and Green's identities are in continuous daily use nearly two centuries after the essay, across fields that did not exist when it was written."
    breadth: Physics and engineering broadly rather than one discipline, which places the benefit wider than a result internal to pure mathematics and narrower than a contribution reaching ordinary life directly.
    attribution: Eponymous three times over and uncontested. Credit today is as securely attached as anything in this corpus.
    observed_recognition: "Nothing in his lifetime beyond a college fellowship, against posthumous recognition that is close to total - three eponymous constructs in standard use, a memorial stone in Westminster Abbey unveiled in 1993 adjoining the graves of Newton and Kelvin, a university library in his name, and his mill restored as a museum. Calibrated against the comparable case already in this corpus, where near-total posthumous eponymy with nothing in life was scored in the same band: this is high recognition arriving very late, not absent recognition."
key_facts:
  - fact: "The essay introduced the potential function; the accessible text states that Green's famous essay, published at Nottingham in 1828, was transcribed from its reprint in Crelle's Journal of 1850 to 1854."
    source: 1
  - fact: "The University of Nottingham records that the 1828 essay was sold on a subscription basis to fifty-one people, most of whom were friends."
    source: 2
  - fact: The same university record states that Green had about one year of formal schooling as a child, between the ages of eight and nine, and was almost entirely self-taught.
    source: 2
  - fact: "It records that in 1846 Green's work was rediscovered by Lord Kelvin, who popularised it for future mathematicians; that Green entered Cambridge as an undergraduate in 1833 at the age of forty; and that he became ill in 1840, returned to Nottingham and died the following year."
    source: 2
  - fact: "Westminster Abbey records that a memorial stone for George Green, mathematician and physicist, was unveiled in the nave in July 1993, adjoining the graves of Sir Isaac Newton and Lord Kelvin, and that theorems derived from his work on electricity and magnetism are used in modern nuclear and solid state physics."
    source: 3
  - fact: The University of Nottingham records that its George Green Library is named after him and that Green's mill was restored to working order in 1986 and operates as a museum and science centre.
    source: 2
analysis:
  - heading: A definition that held
    body: "This is the first case in this domain to evidence delayed recognition, and the corpus's second anywhere. It matters that the fit is clause by clause rather than by resemblance. The published definition turns on time and reception rather than contested credit, and names publication through a low-visibility channel as one route; the record gives a subscription list of fifty-one, eighteen years of silence, a rediscovery by a third party after the author's death, and no rival claimant at any point. Three mechanisms that could have been reached for were tested and refused: no formal barrier is documented, no one took his credit, and no eligibility rule foreclosed an honour."
  - heading: What the self-teaching is, and is not, evidence of
    body: "A man with one year of schooling who published the potential function invites an exclusion reading, and this corpus has two evidenced exclusion cases in this domain to pattern-match against. The record does not support one. Nothing was closed to him: he entered Cambridge, graduated, and held a fellowship at Gonville and Caius. His education is recorded here because it bears on uniqueness - the counterfactual distance between his position and his result is unusually large - and not because it is a barrier this entry can document."
  - heading: The largest gap in this domain that an existing mechanism explains
    body: "His is the second-largest recognition gap in Mathematics and Computing, and the only one of the three largest that the current ontology accounts for. That is worth stating plainly alongside the two it does not account for: a corpus can evidence a mechanism and still be left with deficits its vocabulary cannot reach, and this domain now shows both conditions at once."
