title: George Green
slug: george-green
status: published
last_reviewed: 2026-09-12
domain: mathematics-computing
subfield: mathematics
summary: George Green introduced the potential function, Green's theorem and Green's functions in an 1828 essay sold by private subscription to fifty-one people, almost entirely self-taught; the work was rediscovered by Lord Kelvin in 1846, five years after Green's death, and republished in a German journal in the 1850s.
introduction: This entry was opened to test a mechanism rather than a person - whether delayed recognition, which this project has published as a concept since Cycle 01 and evidenced exactly once anywhere in the corpus, survives contact with a case chosen for it.
omission_case: "His case matters because it is the cleanest available test of a definition. Delayed recognition, as this project defines it, turns on time and reception rather than on contested credit or a formal barrier, and it names publication through a low-visibility channel as one of the ways it arises. An essay sold to fifty-one subscribers, unread for eighteen years, then found and promoted by the most eminent physicist of the next generation, is that definition's own description of itself. The entry was written to find out whether the record bears that out, not to confirm it."
structural_reason: "The documented constraint is the channel, not a barrier and not a rival. The university's own account states that the 1828 essay was sold on a subscription basis to fifty-one people, most of whom were friends; that Green had about one year of formal schooling, between the ages of eight and nine, and was almost entirely self-taught; and that his work was rediscovered by Lord Kelvin in 1846. Nothing in the record shows a position closed to him - he entered Cambridge as an undergraduate at forty and held a college fellowship - and nothing shows another claimant taking his credit."
