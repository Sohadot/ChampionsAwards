audit_exceptions:
  - claim: contribution
    search_date: '2026-09-12'
    search_note: >-
      Sought a readable scan of the 1828 Nottingham printing itself. The accessible text is a
      transcription made from the essay's reprint in Crelle's Journal between 1850 and 1854, with
      typographical corrections and an added reference section, and it says so on its own record.
    best_source: 1
    reason: >-
      Primary-at-one-remove, stated. The text is the essay, by way of the reprint that Kelvin's
      intervention produced, and the verification score is held down rather than the distinction
      being elided.
  - claim: pattern:delayed-recognition
    search_date: '2026-09-12'
    search_note: >-
      Sought the subscription list itself and any contemporary record of the essay's reception between
      1828 and 1846. Neither was reached. The university states the subscription basis, the number of
      subscribers, and the date and agent of the rediscovery; no archival document recording the
      original circulation was found.
    best_source: 2
    reason: >-
      Secondary-record-sufficient, from the institution that holds his archive. What the mechanism
      requires - a low-visibility channel and a long delay before uptake - is documented; the
      underlying subscription record is not in hand, and the entry says so.
mechanism_audit:
  search_date: '2026-09-12'
  ontology_revision: MOR-004
  revision_basis: >-
    Audit performed at commit 0c803c4, when MOR-004 was the revision in force.
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: mechanism-evidenced
  note: >-
    Delayed recognition is evidenced, and on the definition rather than on resemblance. That mechanism
    describes a gap between contribution and acknowledgment that is primarily a function of time and
    reception rather than of contested credit, and names publication through a low-visibility channel
    among its routes. The record gives all of it: an essay sold by subscription to fifty-one people,
    eighteen years before a third party found it, five years after the author's death, and a reprint
    in a foreign journal thereafter. Institutional exclusion was tested and is not tagged - his
    schooling was minimal but nothing was closed to him, he entered Cambridge at forty and held a
    college fellowship, and the definition requires a formal barrier. Credit misattribution is not
    tagged: no person is documented as receiving reward for his work, and the man who found the essay
    spent his effort attaching Green's name to it. Posthumous recognition is not tagged, because that
    mechanism turns on an eligibility rule foreclosing an honour and no such rule is in this record;
    that his recognition is largely posthumous is an outcome here, not a mechanism. Gatekeeping and
    the theory-experiment asymmetry are unsupported.
  best_sources: [1, 2]
