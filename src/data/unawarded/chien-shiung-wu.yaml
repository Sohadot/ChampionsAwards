title: Chien-Shiung Wu
slug: chien-shiung-wu
status: published
last_reviewed: 2026-09-09
summary: Chien-Shiung Wu designed and led the experiment that demonstrated the violation of parity conservation in 1956-57, yet the 1957 Nobel Prize in Physics went to the theorists Tsung-Dao Lee and Chen Ning Yang.
introduction: Wu's case is frequently cited because the experimental confirmation that made the theory credible was hers, while the prize recognised the theoretical prediction alone.
omission_case: Her exclusion matters because a prediction of this magnitude required decisive experimental proof, and that proof was the contribution the prize did not honour.
structural_reason: Recognition was shaped by the era's tendency to elevate theory over experiment and by the position of women in mid-century physics institutions.
