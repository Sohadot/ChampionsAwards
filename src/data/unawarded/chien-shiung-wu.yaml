    impact: The result overturned an assumed symmetry and reshaped particle physics.
    verification: The Wu experiment is thoroughly documented in the physics literature.
    uniqueness: The experiment demanded exceptional technique, though experimental confirmation was foreseeable in principle.
    durability: Parity violation remains a settled and foundational result.
    breadth: The benefit is scientific and concentrated within physics.
    attribution: Credit was split between theory and experiment, with the experiment under-recognised by the prize.
key_facts:
  - fact: Wu led the 1956-57 experiment demonstrating that parity is not conserved in weak interactions.
    source: 1
  - fact: The 1957 Nobel Prize in Physics was awarded to Tsung-Dao Lee and Chen Ning Yang.
    source: 2
  - fact: In 1978 Wu received the inaugural Wolf Prize in Physics.
    source: 1
analysis:
  - heading: Theory versus experiment in the credit structure
    body: "Wu's case exposes a recurring asymmetry: prize architectures often reward the prediction over the proof, even when the proof is what converts a hypothesis into accepted science. The recognition gap here is moderate, softened by later honours, but the pattern is structural rather than incidental."
