audit_exceptions:
  - claim: observed-recognition
    search_date: '2026-09-12'
    search_note: "The awarding society's own laureate pages at awards.acm.org and amturing.acm.org returned HTTP 403 to this audit and could not be read directly, as they did in the Cycle 03 requalification of the Turing Award itself. The award year and the citation wording are taken from a foundation that co-organises its laureate meeting with the society, and are corroborated by the university's news office and by a second award-giving institution."
    best_source: 2
    reason: "Institution-record-sufficient at one remove. The citation is quoted from a body that publishes it as a laureate record rather than from the society that issued it, and the entry says so rather than implying access it does not have."
mechanism_audit:
  search_date: '2026-09-12'
  ontology_revision: MOR-004
  revision_basis: >-
    Audit performed at commit 8922757, when MOR-004 was the revision in force.
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism is evidenced, and in this case the finding carries no deficit to explain. The gap is
    slightly negative, which places the case in the band where recognition roughly matches assessed
    merit, so the audit is recorded as an aligned outcome rather than as unexplained under-recognition.
    Each mechanism was tested against the record and none is met. Credit misattribution fails in the
    strongest way available: her own history distributes credit outward to named collaborators, and no
    source contests her authorship of the work. Delayed recognition fails because the major awards
    arrived during her working life. Institutional exclusion was tested against the one documented
    biographical fact that could support it - she is reported as the first woman in the United States
    to earn a computer science doctorate - and is not tagged, because a documented first is not a
    documented barrier and no formal rule or refused appointment is in the record. Gatekeeping,
    posthumous recognition and the theory-experiment asymmetry have no purchase on this case at all.
  best_sources: [1, 3]
