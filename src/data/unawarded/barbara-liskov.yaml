  rationale:
    impact: Data abstraction reorganised how software is written, and the language that first supported it directly was designed under her direction; the Franklin Institute's citation ties the contribution to the implementation of reliable, reusable programs.
    verification: The contribution is anchored to her own technical report on the history of the work, published by her laboratory, and is independently described by two award-giving institutions.
    uniqueness: "CLU was the first implemented language to provide direct linguistic support for data abstraction, which is a specific and datable first. Her own history qualifies the claim in two ways this entry keeps: Alphard was being developed in parallel toward the same idea, and the concept itself was refined jointly with a colleague before the language work began."
    durability: The constructs CLU introduced are standard in languages in use today, and the subtyping rule from her 1988 keynote carries her name.
    breadth: The remit is computing rather than society at large, but the reach within it is wide, since the techniques are general to software rather than to one application.
    attribution: Credit is unambiguous, is eponymous in the substitution principle, and is not contested; her own history names her collaborators and the three graduate students who designed the language with her, which is the opposite of the displacement this corpus usually records.
    observed_recognition: The field's highest award in 2008, an engineering institute's medal in 2004, a national science museum's medal in 2023, election to both national academies, and her university's highest faculty honour in the same year as the Turing Award. This is close to the ceiling of what computing can confer, and is scored above the highest figure previously recorded in this corpus.
key_facts:
  - fact: "Liskov's own history of the work states that CLU was the first implemented programming language to provide direct linguistic support for data abstraction, and that it also introduced its exception handling mechanism, its iterators and its parameterized types."
    source: 1
  - fact: "In the same history she records that she began working with Steve Zilles at MIT in 1973 on a similar idea and that they refined the concept of abstract types together, and she names Russ Atkinson, Craig Schaffert and Alan Snyder as the other three main language designers."
    source: 1
  - fact: "The ACM A.M. Turing Award for 2008 was given to her for contributions to practical and theoretical foundations of programming language and system design, especially related to data abstraction, fault tolerance and distributed computing."
    source: 2
  - fact: "The Franklin Institute awarded her the Benjamin Franklin Medal in 2023 for seminal contributions to computer programming languages and methodology, enabling the implementation of reliable, reusable programs, and records her election to the National Academies of Sciences and of Engineering and her IEEE John von Neumann Medal."
    source: 3
  - fact: Her university reports that she was the first woman in the United States to earn a PhD from a computer science department, and that she was named an Institute Professor, its highest faculty honour, in the year before the Turing Award was announced.
    source: 4
analysis:
  - heading: A control, entered first, on the empty side of the domain
    body: "Computing held three recognition systems and no cases when Cycle 03 measured the domain's two halves, and the subfield audit recorded that the internal comparison the domain's name implies was not yet meaningful. The first case entered on that side therefore sets what the side looks like. This entry was selected because the recognition record is unusually complete rather than unusually thin, so that computing does not begin as a register of omissions and then get read as though the register were a finding."
  - heading: What the instrument returns when recognition tracks contribution
    body: "The assessed index and the observed recognition land within a few points of each other, which the gap bands classify as recognition roughly matching assessed merit. That is the intended reading. Two entries in the Biology and Medicine corpus already returned the same class, so the instrument's capacity to report alignment is not new; what is new is that this is the first entry in the corpus whose subject holds the single highest award her domain confers."
  - heading: What this entry does not claim
    body: "It does not claim that the absence of a mechanism here is evidence that computing recognises contribution reliably. One case establishes nothing about a system's behaviour, and the mechanism audit below returns no evidenced mechanism for the ordinary reason that there is no deficit for a mechanism to explain. It also does not treat her being the first woman in the United States to hold a computer science doctorate as an exclusion finding; the fact is documented, its bearing on her recognition is not, and this corpus keeps those apart."
