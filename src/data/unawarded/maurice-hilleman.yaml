mechanism_audit:
  search_date: '2026-09-11'
  ontology_revision: MOR-003
  revision_basis: >-
    Audit performed at commit 60e148d (2026-09-11), when MOR-003 was the revision in force. The
    considered list was later pruned at commit 005a421 (MOR-004) to remove concepts that had ceased
    to be audit-eligible; that edit removed candidates, it did not test any new one, so the audit
    remains an MOR-003 audit.
  considered:
    - credit-misattribution
    - institutional-exclusion
    - institutional-gatekeeping
    - delayed-recognition
    - posthumous-recognition
  incomplete_at_revision:
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism is supported, and none was sought beyond the ontology. Credit misattribution fails:
    attribution is consistent and public across institutional records. Institutional exclusion fails:
    he was elected to the National Academy of Sciences and awarded a national medal. Delayed
    recognition fails: the major recognitions arrived during his career. Gatekeeping and posthumous
    rules are unsupported. The absence of a Nobel Prize is recorded as a fact about one award and is
    not treated as evidence of a mechanism. This case was accepted into the corpus expecting a small
    gap, and the measured gap is small; that outcome is the point of including it.
  best_sources: [1, 3]
