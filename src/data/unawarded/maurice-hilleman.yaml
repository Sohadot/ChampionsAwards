  rationale:
    impact: He was responsible for eight of the vaccines on the United States schedule of recommended childhood immunisations, including measles, mumps, hepatitis A and hepatitis B.
    verification: The contribution is anchored to primary publication and is documented across institutional records.
    uniqueness: Vaccine development at this scale is industrial and collaborative, which bounds any counterfactual claim about a single individual, though his personal role is documented.
    durability: The vaccines remain in routine use decades later.
    breadth: The benefit is about as broad as a biomedical contribution can be - routine childhood immunisation worldwide.
    attribution: Credit is consistently and publicly assigned to him by the awarding and professional institutions.
    observed_recognition: The Lasker Public Service Award in 1983, the National Medal of Science in 1988, and election to the National Academy of Sciences - a high level of recognition across independent systems, without the single highest scientific award.
key_facts:
  - fact: "Hilleman was first author of \"Live, attenuated mumps-virus vaccine\" in the New England Journal of Medicine in 1968, reporting the vaccine strain still used in the mumps component of MMR."
    source: 1
  - fact: By his death in 2005 he was responsible for eight vaccines on the United States schedule of recommended childhood immunisations - measles, mumps, hepatitis A, hepatitis B, chickenpox, and vaccines against Neisseria meningitidis, Streptococcus pneumoniae and Haemophilus influenzae.
    source: 2
  - fact: "He received the 1983 Albert Lasker Public Service Award \"for discovering the causes of certain viral disease, and for pioneering breakthroughs in vaccine development for the benefit of mankind\"."
    source: 3
  - fact: He received the National Medal of Science in 1988 and was elected to the National Academy of Sciences.
    source: 4
analysis:
  - heading: What a control case is for
    body: "If a recognition index finds a large gap wherever it looks, it is measuring its own selection rather than the world. This entry is the check. A contribution of the first rank, recognised by a major prize, a national medal and a national academy, should produce a small gap - and it does. The result is useful precisely because it is undramatic: it shows the instrument responding to recognition that was actually given."
  - heading: The absence of one award is not a mechanism
    body: "Hilleman received no Nobel Prize. The corpus records that as a fact about one recognition system and stops there. Treating a single non-award as evidence of a structural failure would be exactly the inference this project refuses to make elsewhere, and the mechanism audit for this case found nothing to support one."
