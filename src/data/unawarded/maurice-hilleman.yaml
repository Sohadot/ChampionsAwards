title: Maurice Hilleman
slug: maurice-hilleman
status: published
last_reviewed: 2026-09-12
domain: biology-medicine
summary: Maurice Hilleman developed vaccines responsible for eight of the immunisations on the United States childhood schedule, and received the Lasker Public Service Award, the National Medal of Science and election to the National Academy of Sciences - but never a Nobel Prize.
introduction: This entry was opened as a control. A corpus assembled only from dramatic attribution disputes would manufacture its own bias, so it needs cases where a very large contribution may turn out to have been recognised in proportion.
omission_case: His case matters for what it tests rather than what it alleges - whether the instrument reports a small gap when recognition actually tracked contribution, instead of finding injustice wherever it looks.
structural_reason: "No structural reason is offered. The record shows a contribution of exceptional scale and a recognition record of exceptional breadth across public, governmental and professional systems. The absence of a Nobel Prize is a fact about one award, not by itself evidence of a mechanism, and this entry does not treat it as one."
