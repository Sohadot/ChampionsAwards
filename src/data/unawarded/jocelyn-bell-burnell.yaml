title: Jocelyn Bell Burnell
slug: jocelyn-bell-burnell
status: published
last_reviewed: 2026-09-09
summary: Jocelyn Bell Burnell detected the first radio pulsars as a graduate student in 1967, yet the 1974 Nobel Prize in Physics for the discovery was awarded to her supervisor Antony Hewish and Martin Ryle, not to her.
introduction: Bell Burnell's case is among the most discussed in twentieth-century physics recognition, because the observational discovery was hers while the prize followed the era's hierarchy of supervisor over student.
omission_case: Her exclusion matters because the pulsar signal was identified and pursued through her own observational persistence, making the omission a question about how credit flows within research hierarchies.
structural_reason: Recognition was shaped by the norms of the period regarding students and supervisors, and by the tendency of prize committees to reward established figures over early-career discoverers.
