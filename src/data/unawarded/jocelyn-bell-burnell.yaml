analysis:
- heading: A gap the field itself later corrected
  body: 'Bell Burnell''s recognition gap is moderate rather than extreme, because the scientific community substantially corrected the record over subsequent decades through major honours. The case illustrates a softer failure mode than outright erasure: delayed recognition routed first through the institutional hierarchy before reaching the discoverer.'
