analysis:
  - heading: How rules and timing shaped the record
    body: "Two structural facts frame this case: the prize's rule against posthumous awards, and Franklin's death in 1958. Whatever the contemporary attribution disputes, the institution could not have recognized her in 1962 even in principle - a reminder that recognition systems encode rules that can foreclose merit independently of judgment."
