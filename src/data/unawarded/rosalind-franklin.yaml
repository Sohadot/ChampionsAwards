title: Rosalind Franklin
slug: rosalind-franklin
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: Rosalind Franklin's X-ray diffraction work on DNA was published in Nature in April 1953 alongside the Watson-Crick model it helped establish, and the 1962 Nobel Prize in Physiology or Medicine for that discovery went to Watson, Crick and Wilkins, four years after her death.
introduction: This entry keeps three questions apart that are usually merged - what Franklin contributed, how her data reached the model-builders and how it was credited, and what the record does and does not establish about the 1962 award.
omission_case: Her case matters because the popular account and the documentary record diverge, and because the most commonly repeated explanation for her exclusion from the 1962 prize - the Nobel prohibition on posthumous awards - is an anachronism this entry previously reproduced and now corrects.
structural_reason: "Three separable strands. The contribution is anchored to her own 1953 Nature paper with Gosling. The attribution strand is contested in the historical literature: a 2023 reassessment of the Franklin archive argues she was an equal member of the group that solved the structure rather than a researcher whose data was taken without her understanding it. The 1962 outcome is documented as an outcome, and its reasons are not: the deliberations are not published and the nomination archive for Physiology or Medicine is currently open only through 1953."
