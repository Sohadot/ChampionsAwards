title: Rosalind Franklin
slug: rosalind-franklin
status: published
last_reviewed: 2026-09-08
summary: Rosalind Franklin's X-ray diffraction work was central to determining the structure of DNA, yet the 1962 Nobel Prize for that discovery went to James Watson, Francis Crick, and Maurice Wilkins.
introduction: Franklin's case is frequently cited because her experimental images were pivotal evidence for the double-helix model, while the recognition architecture of the era routed the prize elsewhere.
omission_case: Her omission matters because Nobel Prizes are not awarded posthumously, and Franklin died in 1958, four years before the 1962 award - so the case also exposes how timing and institutional rules interact with credit.
structural_reason: Recognition was shaped by the norms of the period, the informal circulation of her data, and the rule against posthumous awards, which together placed her contribution outside the prize's reach.
