  rationale:
    impact: Her diffraction work on the B form of DNA was central evidence for the double-helix structure, published in Nature in the same issue as the model.
    verification: The contribution is anchored to her own primary publication, and a 2023 reassessment based on her archive independently supports the scale of her role.
    uniqueness: The experimental technique was specialised, though several researchers contributed to the wider effort.
    durability: The DNA double helix is foundational to modern biology.
    breadth: Molecular biology's downstream benefits are extremely wide.
    attribution: Contemporaneous credit was partial - the model paper referred to unpublished King's College results in general terms rather than to her specific data - and the subsequent record has been contested in both directions. Unchanged by the 2026-09-11 requalification; the justification is narrowed to what the documents show.
    observed_recognition: No major prize in her lifetime and no share of the 1962 award, against substantial posthumous recognition including an award of the Royal Society that carries her name. Raised from 40 in the 2026-09-11 requalification, which found the earlier figure did not account for the posthumous recognition actually documented.
key_facts:
  - fact: "Franklin and Gosling published \"Molecular Configuration in Sodium Thymonucleate\" in Nature, volume 171, pages 740-741, in April 1953."
    source: 3
  - fact: "Watson and Crick's \"Molecular Structure of Nucleic Acids: A Structure for Deoxyribose Nucleic Acid\" appeared in the same volume of Nature, pages 737-738, April 1953."
    source: 4
  - fact: The 1962 Nobel Prize in Physiology or Medicine was awarded to James Watson, Francis Crick and Maurice Wilkins.
    source: 2
  - fact: The Nobel Foundation states that the prohibition on awarding a prize posthumously entered its Statutes in 1974, and that before 1974 the prize had been awarded posthumously twice - to Erik Axel Karlfeldt in 1931 and Dag Hammarskjoeld in 1961.
    source: 5
  - fact: The Nobel nomination archive currently publishes nominations for Physiology or Medicine only through 1953, so nominations and deliberations bearing on the 1962 award cannot be checked.
    source: 6
  - fact: A 2023 reassessment in Nature, drawing on a previously overlooked 1953 letter and an unpublished draft news article from Franklin's archive, argues that she was an equal member of the group that solved the double helix rather than a researcher who failed to grasp her own data.
    source: 7
analysis:
  - heading: Correcting a rule applied to the wrong decade
    body: "This entry previously stated that the Nobel could not have recognised Franklin in 1962 'even in principle', because prizes are not awarded posthumously. That is an anachronism. The Nobel Foundation's own record states that the prohibition entered the Statutes in 1974, and that two prizes had been awarded posthumously before then. A rule introduced twelve years after a decision cannot explain it. What remains documented is narrower and more useful: she died in 1958, the 1962 prize went to three living men, and the deliberations are not in the public record - the Physiology or Medicine nomination archive is open only through 1953."
  - heading: A contested attribution, shown as contested
    body: "The attribution strand is where the historical literature has moved most. The model paper acknowledged unpublished King's College results in general terms rather than naming the specific data it used, and the popular account has long described Franklin as a victim whose image was taken without her knowledge. A 2023 reassessment based on documents in her own archive argues instead that she was an equal member of a group of four and understood what her data showed. This entry records both the documentary basis of the credit question and the revision, and asserts neither the victim narrative nor its dismissal as settled."
