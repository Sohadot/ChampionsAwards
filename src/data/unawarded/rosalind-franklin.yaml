    rule_at_time:
      event_date: 1962
      rule_in_force: >-
        No eligibility rule is applied to this outcome, because none was established for 1962. The
        Nobel Foundation's prohibition on posthumous awards entered the Statutes in 1974 - twelve
        years after this decision - and before 1974 the prize had been awarded posthumously twice
        (1931 and 1961). The version of the rule governing a candidate who had died in 1958 was not
        reached by this audit.
      exception:
        search_date: '2026-09-11'
        search_note: >-
          Searched the Nobel Foundation's published Statutes and its facts pages for the text in force
          in 1962 and for the pre-1974 treatment of deceased candidates. Only the current Statutes and
          the date of the 1974 change are published; no earlier version of the text was reachable.
        best_source: 5
        reason: >-
          The record establishes when the modern rule began, not what preceded it. Applying the modern
          rule to 1962 would be an anachronism, so no rule is applied and the outcome stands as an
          outcome without an established rule-based explanation.
