audit_exceptions:
  - claim: observed-recognition
    search_date: '2026-09-12'
    search_note: >-
      Two further prizes for this result - a society prize in number theory for 2014, shared with
      Goldston, Pintz and Yildirim, and an international prize for 2013 - are widely reported. The
      awarding society's prize pages returned HTTP 403 to this audit and the university's own news
      release redirected to its homepage, so neither was read at an awarding-body source.
    best_source: 2
    reason: >-
      Excluded from the anchored basis rather than asserted. The observed-recognition score rests on
      the two awards read at source; the excluded pair would not move it into a different band.
  - claim: uniqueness
    search_date: '2026-09-12'
    search_note: >-
      The shared character of the 2014 society prize, and the rapid improvement of the bound by other
      mathematicians after publication, are reported consistently but were not read at an
      awarding-body or journal source. What is anchored is the author's own abstract naming the work
      his method refines.
    best_source: 1
    reason: >-
      Primary-sufficient for what is claimed. The uniqueness score is lowered on the author's own
      statement of his antecedents, which is the strongest available evidence and is in the paper.
mechanism_audit:
  search_date: '2026-09-12'
  ontology_revision: MOR-004
  revision_basis: >-
    Audit performed at commit bd4083d, when MOR-004 was the revision in force.
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism is evidenced, and the gap is negative, so the case falls in the band where
    recognition roughly matches assessed merit rather than in unexplained under-recognition. Delayed
    recognition is the mechanism this case most conspicuously does not exhibit: the major awards
    arrived within about a year of publication, which is the opposite of what that mechanism
    describes. Institutional exclusion was tested against the one documented fact that could support
    it - that he held a lecturer's post and had worked outside academic mathematics beforehand - and
    is not tagged, because the definition requires a formal barrier to an appointment, membership,
    authorship or pay, and none is in the record. Credit misattribution fails because his authorship
    is sole and uncontested, and because his own paper credits the work it builds on rather than
    obscuring it. Gatekeeping, posthumous recognition and the theory-experiment asymmetry have no
    purchase on this case.
  best_sources: [1, 2]
