  rationale:
    impact: "The first finite bound on the gap between consecutive primes settled a question that had resisted every prior attempt, and opened a line of work that improved the bound rapidly afterwards. It is one theorem in analytic number theory rather than a reorganisation of a field, and is scored accordingly."
    verification: "The proof was published in the discipline's leading journal, and the field's response was to extend it immediately - an unusually direct and public form of verification."
    uniqueness: "The lowest uniqueness score in this corpus, on the author's own framing. His abstract states that the method is a refinement of the recent work of Goldston, Pintz and Yildirim, and the society prize for the result was shared with those three for related but separate work. The bound was his and nobody else had it; the counterfactual distance between his result and the state of the art was short, and the entry says so rather than treating a breakthrough as if it were unprecedented."
    durability: "What endures is that a finite bound exists and that the method reaches it. The specific figure of seventy million did not endure - the field reduced it within months of publication - so this dimension is scored on the result's standing rather than on its number."
    breadth: The lowest breadth score in this corpus. The benefit is internal to number theory, and the instrument weights benefit to society; that is a property of the DDI rather than a judgment about the mathematics.
    attribution: Sole authorship, uncontested credit, and a paper that names its own antecedents.
    observed_recognition: "Scored on two anchored awards within about a year of publication - an international academy's prize and a foundation fellowship - both citing this result specifically. Two further prizes for the same work are widely reported and are not included here, because no awarding body's own record for them was reached; see the documented exception. This is dense and fast recognition rather than broad recognition, and it is scored below the corpus's most decorated cases for that reason."
key_facts:
  - fact: "The paper proves that the lower limit of the gap between consecutive primes is less than seven times ten to the seventh, and its abstract states that the method is a refinement of the recent work of Goldston, Pintz and Yildirim on small gaps between consecutive primes."
    source: 1
  - fact: "It was published as \"Bounded gaps between primes\" in the Annals of Mathematics, volume 179, issue 3, pages 1121 to 1174, in 2014."
    source: 1
  - fact: The MacArthur Foundation named him a Fellow in its class of 2014, as a professor in the Department of Mathematics at the University of New Hampshire, for proving that the difference in spacing between two consecutive primes is infinitely often bounded by a fixed number.
    source: 2
  - fact: "The Royal Swedish Academy of Sciences awarded him the Rolf Schock Prize in Mathematics for 2014, for his spectacular breakthrough concerning the possibility of an infinite number of twin primes."
    source: 3
  - fact: The MacArthur Foundation records that before this work he held a range of positions outside academic mathematics and joined the University of New Hampshire as a lecturer in 1999.
    source: 2
analysis:
  - heading: What a narrower contribution does to the instrument
    body: "This is the lowest assessed index in the domain, and the two dimensions that put it there are uniqueness and breadth - both scored down on documented grounds rather than on impression. The uniqueness score follows the author's own abstract, which frames the method as a refinement of named earlier work, and the society prize that was shared with the authors of that work. The breadth score follows the instrument's design, which weights benefit to society and therefore reads a result internal to number theory as narrower than one with a wider surface. Neither is a statement that the mathematics is lesser."
  - heading: Lower assessed merit did not bring lower recognition
    body: "The gap is slightly negative, which places the case in the band where recognition roughly matches assessed merit. That is the finding this entry was opened to test. A corpus whose cases all sat within two points of each other could not distinguish between an instrument that discriminates on merit and one that does not; this case shows the merit side moving several points while the recognition side stays high. The two are not locked together."
  - heading: Why the Fields Medal is not on this page
    body: "He was well past forty when the result appeared, and this project published an anatomy of the Fields Medal's age rule in the same cycle, so the connection is available and tempting. It is not made. No record read here shows that the rule was applied to him, that he was considered, or that any body said anything about his eligibility - and the Wiles entry earns its eligibility relation precisely because the Congress's own press office stated the rule at the time. An inference from a birth date is not a documented interaction, and the corpus does not manufacture one."
