title: Yitang Zhang
slug: yitang-zhang
status: published
last_reviewed: 2026-09-12
domain: mathematics-computing
subfield: mathematics
summary: Yitang Zhang proved in a 2014 Annals of Mathematics paper that the gap between consecutive primes is infinitely often smaller than seventy million - the first finite bound of its kind - and the major awards arrived within about a year of the result rather than decades later.
introduction: This entry was opened to test something about the instrument rather than something about the person - whether a contribution that is narrow by construction scores lower on the Deservingness Index, and if it does, whether the recognition follows it down.
omission_case: "His case matters because the two things it puts in tension are usually confounded. The contribution is a single theorem, deliberately bounded: one finite bound on one classical question, in a method the author himself describes as a refinement of earlier work. The recognition is fast and large. Whether those move together is the question the corpus could not ask while every case in this domain sat within two points of every other."
structural_reason: "No structural reason is offered, and none is evidenced. The record shows a result accepted quickly by the field's leading journal and honoured by an international academy and a foundation within roughly a year of publication. One fact is recorded and deliberately not treated as a mechanism: he held a lecturer's post rather than a research chair when the work was done, having worked outside academic mathematics for years beforehand. That is documented, and the corpus makes no claim that it shaped the recognition that followed."
