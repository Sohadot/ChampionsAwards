  rationale:
    impact: The chromosomal basis of sex determination is foundational to genetics.
    verification: The contribution is anchored to her own Carnegie Institution monograph, and was independently reproduced in the same year.
    uniqueness: Counterfactual uniqueness is genuinely bounded - E. B. Wilson reached the same conclusion independently in 1905, which the corpus records rather than discounts.
    durability: Sex chromosomes remain a central object of biology.
    breadth: The benefit is deep within biology rather than broad across society.
    attribution: Wilson acknowledged her work in his own 1905 publication, and current scholarship credits her firmly; her monograph has nonetheless been cited fewer than a hundred times.
    observed_recognition: Substantial recognition during her lifetime - a Carnegie grant, a named prize, listing among the leading scientists of the era, a professorship offered - against a modest position in the later record compared with her contemporaries.
key_facts:
  - fact: "Stevens published \"Studies in Spermatogenesis\" with the Carnegie Institution of Washington in 1905, showing that spermatozoa carrying the small chromosome determine male sex."
    source: 1
  - fact: E. B. Wilson published similar findings in 1905, independently, and acknowledged Stevens's work in a footnote to that publication.
    source: 2
  - fact: Stevens received a Carnegie Institution grant in 1903 to study sex determination, a postdoctoral position in 1904, the Ellen Richards Prize in 1905, listing among the top thousand in American Men of Science in 1910 as one of eighteen women, and an offer of a research professorship at Bryn Mawr in 1912.
    source: 2
  - fact: She died of breast cancer on 4 May 1912, aged fifty, and her monograph has been cited fewer than one hundred times against more than six thousand peer-reviewed articles published on sex chromosomes since.
    source: 2
analysis:
  - heading: A case that did not produce a mechanism
    body: "The audit for this entry tested every mechanism in the ontology and recorded none. Credit was not displaced to a named other: Wilson reached the same result independently and cited her. She was not excluded from the institutions of her field: she was funded by one, prized by another, and offered a professorship by a third. What the record shows is a real gap between the standing of the discovery and the standing of the discoverer in the later literature, with no documented act producing it. That is a finding, not a failure to find one."
