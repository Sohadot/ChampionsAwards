title: Nettie Stevens
slug: nettie-stevens
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: Nettie Stevens published the evidence in 1905 that sex is determined by a chromosomal difference, was independently paralleled the same year by E. B. Wilson, received substantial recognition during her lifetime, and died in 1912 before taking up a research professorship.
introduction: This case was opened expecting a recognition gap and audited without one being assumed. What the record shows is a contribution of the first rank, a genuine parallel discovery, and a career that was recognised in its own time more than the popular account suggests.
omission_case: Her case matters as a test of the method rather than as an instance of injustice - the corpus needs cases where the audit can come back without an evidenced mechanism, or the ontology will only ever confirm itself.
structural_reason: "Two facts constrain any explanation. First, the discovery was made independently by E. B. Wilson in the same year, and Wilson acknowledged her work in a footnote to his 1905 publication, so this is a parallel discovery rather than a displaced one. Second, she was recognised in her lifetime: a Carnegie Institution grant in 1903 to study sex determination, the Ellen Richards Prize in 1905, inclusion among the top thousand in American Men of Science in 1910 as one of eighteen women, and a research professorship at Bryn Mawr offered in 1912. What is documented afterwards is thin citation of her monograph rather than an identified act of misattribution."
