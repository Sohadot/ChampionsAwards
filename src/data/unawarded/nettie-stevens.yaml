mechanism_audit:
  search_date: '2026-09-11'
  ontology_revision: MOR-003
  revision_basis: >-
    Audit performed at commit 60e148d (2026-09-11), when MOR-003 was the revision in force. The
    considered list was later pruned at commit 005a421 (MOR-004) to remove concepts that had ceased
    to be audit-eligible; that edit removed candidates, it did not test any new one, so the audit
    remains an MOR-003 audit.
  considered:
    - credit-misattribution
    - institutional-exclusion
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
  incomplete_at_revision:
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism in the ontology is supported for this case. Credit misattribution fails on the
    evidence: Wilson's 1905 work was independent and acknowledged hers in a footnote, and current
    scholarship credits her directly. Institutional exclusion fails: she held a Carnegie grant from
    1903, a postdoctoral position from 1904, a named prize in 1905, listing among the leading
    scientists of her era in 1910, and an offered research professorship in 1912. Delayed recognition
    fails: recognition arrived during her lifetime rather than long after. Gatekeeping and posthumous
    rules are unsupported by anything in the sources consulted. What remains documented is a
    contribution of the first rank whose author occupies a smaller place in the later literature than
    the discovery does - a gap measured without a mechanism recorded to explain it. Her early death
    at fifty, shortly before taking up a research professorship, is a fact of the case and is not
    offered here as a mechanism, since the ontology contains none that it matches.
  best_sources: [1, 2]
