audit_exceptions:
  - claim: attribution
    search_date: '2026-09-11'
    search_note: "Sought a record-grade source for how credit was apportioned between Stevens and Wilson. The best available account is a 2022 open-access review in Philosophical Transactions of the Royal Society B, which reports Wilson's footnote acknowledgment and the low citation count of her monograph."
