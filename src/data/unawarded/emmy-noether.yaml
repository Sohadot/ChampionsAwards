audit_exceptions:
  - claim: attribution
    search_date: '2026-09-11'
    search_note: "Sought a record-grade source for how credit for her work was distributed between her own papers and those of colleagues and students. The MacTutor biography states that much of her work appears in papers written by others; no archival document apportioning credit was reached."
    best_source: 2
    reason: Secondary-record-sufficient. The entry claims eponymous standing today, which is uncontested, and makes no claim that any individual displaced her credit.
  - claim: pattern:institutional-exclusion
    search_date: '2026-09-11'
    search_note: "Sought the Goettingen faculty records of the habilitation dispute. The university's own archival documents were not reached; the sequence - refusal, years of lecturing under Hilbert's name with the catalogue entry quoted, habilitation granted 1919 - is documented consistently by the MacTutor biography maintained by the University of St Andrews."
    best_source: 2
    reason: "Secondary-record-sufficient. The rule and its application are documented; the underlying faculty minutes are not in hand, and the entry says so rather than implying archival access it does not have."
mechanism_audit:
  search_date: '2026-09-11'
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: mechanism-evidenced
  note: >-
    Institutional exclusion is evidenced as a formal barrier: the habilitation was closed to women,
    was granted to her at Goettingen only in 1919 after a protracted dispute, and in the interval her
    courses were advertised under another professor's name. Credit misattribution was tested and not
    tagged: much of her work reached print through colleagues and students, but no displacement of
    reward to a named other is documented, and the modern record is eponymous. Delayed recognition was
    tested and not tagged, and this is a change from the earlier entry: the slow transmission of the
    1918 theorem into physics concerns a result's uptake, while her own recognition arrived during her
    working life - two ICM invited addresses and a shared national prize - so the mechanism's
    definition is not met. Gatekeeping is unsupported. Posthumous recognition is not tagged: her
    recognition after death is large, but no eligibility rule foreclosed anything, which is what that
    mechanism turns on.
  best_sources: [1, 2]
