analysis:
  - heading: Barriers before the record could form
    body: "Noether's gap is distinctive because the obstruction operated before recognition could even accrue: institutional rules limited her appointments and pay, constraining the visibility from which honours normally follow. The theorem's centrality today throws the earlier exclusion into sharp relief."
