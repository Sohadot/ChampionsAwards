  rationale:
    impact: The 1918 theorem connects continuous symmetries to conservation laws and is foundational to theoretical physics, alongside her reshaping of abstract algebra.
    verification: The contribution is anchored to her own published paper, and the results were adopted and extended across two fields.
    uniqueness: The variational-symmetry result and the structural approach to algebra were distinctly hers.
    durability: Noether's theorem and Noetherian structures remain standard.
    breadth: The benefit is deep within physics and mathematics rather than broad across society.
    attribution: Credit is unambiguous today and eponymous in both fields, though much of her work reached print in papers by colleagues and students rather than under her own name. Raised from 70 in the 2026-09-11 requalification.
    observed_recognition: Invited addresses at the International Congress of Mathematicians in 1928 and 1932, the Ackermann-Teubner Memorial Prize in 1932 shared with Artin, and posthumous recognition that is close to total - eponymous results in two fields and an ICM lecture named after her - against no paid chair in her lifetime and dismissal in 1933. Raised from 45 in the 2026-09-11 requalification, which found the earlier figure did not account for the recognition actually documented.
key_facts:
  - fact: "Noether published \"Invariante Variationsprobleme\" in the Nachrichten of the Goettingen Academy in 1918."
    source: 1
  - fact: "The habilitation was not open to women, and at Goettingen it was granted to her only in 1919, after what the record describes as a long battle with the university authorities, at which point she became a Privatdozent."
    source: 2
  - fact: "During that period Hilbert advertised her courses under his own name - a 1916-17 catalogue entry reads \"Mathematical Physics Seminar: Professor Hilbert, with the assistance of Dr E Noether\"."
    source: 2
  - fact: She was invited to address the International Congress of Mathematicians in Bologna in 1928 and in Zurich in 1932, and in 1932 received the Alfred Ackermann-Teubner Memorial Prize jointly with Emil Artin.
    source: 2
  - fact: In April 1933 she was dismissed from the University of Goettingen because she was Jewish, and received no pension or other compensation.
    source: 2
  - fact: The International Mathematical Union's ICM Emmy Noether Lecture, a permanent ICM tradition since 2006, is named after her and honours women who have made fundamental and sustained contributions to the mathematical sciences.
    source: 3
analysis:
  - heading: A rule, not an atmosphere
    body: "What this entry claims about exclusion is narrow and documented: a formal route to an academic post that was closed to her as a woman, granted only after a dispute that took years, and years of teaching credited in the catalogue to someone else. That is the published definition of institutional exclusion - formal barriers to positions constraining the visibility from which honours follow. It is not a claim that every feature of her career followed from it."
  - heading: What the requalification changed
    body: "The earlier entry scored her observed recognition at 45 and explained her gap partly by the delayed diffusion of her results into physics. Both are revised. The recognition record documents two ICM invited addresses, a shared national prize in her lifetime, and eponymous standing in two fields afterwards, which the earlier figure did not reflect. The diffusion claim is withdrawn as unevidenced: how fast a theorem travelled is a question about a result, and the corpus found nothing tying it to recognition withheld from its author."
