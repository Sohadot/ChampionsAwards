title: Emmy Noether
slug: emmy-noether
status: published
last_reviewed: 2026-09-11
domain: mathematics-computing
subfield: mathematics
summary: Emmy Noether published in 1918 the theorem linking continuous symmetries to conservation laws, was refused the habilitation at Goettingen until 1919 because she was a woman, lectured for years under Hilbert's name, held no paid chair, and was dismissed in 1933.
introduction: This entry keeps three questions apart that its earlier version merged - what she contributed, what formally constrained her academic standing, and how much recognition she actually received.
omission_case: Her case matters because the constraint is documented as a rule rather than inferred from an absence of honours, and because the recognition she did receive was substantial enough that the earlier entry's score understated it.
structural_reason: "The documented constraint is formal and specific: the habilitation, the standard route to an academic post, was closed to her as a woman, and was granted only in 1919 after a long dispute with the university authorities. During those years her courses were advertised under Hilbert's name. The earlier version of this entry also attributed her gap to the 'delayed diffusion' of her results into physics; that claim is withdrawn - the transmission of the 1918 theorem is a question about a result's uptake, not about recognition withheld from her, and the audit found no evidence tying the two together."
