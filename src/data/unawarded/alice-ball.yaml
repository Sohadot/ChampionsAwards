  finding: mechanism-evidenced
  note: >-
    Credit misattribution is evidenced by her own institution's record: her findings were published by
    another under his own name, key research she conducted went unmentioned, and the method was
    renamed after him. Delayed recognition was tested and deliberately not tagged, although the
    interval is long: its published definition requires that the gap be a function of time and
    reception "rather than of contested credit", and in this case contested credit is exactly what the
    record documents. Posthumous recognition was tested and not tagged: recognition did arrive after
    her death, but no eligibility rule foreclosed anything, which is what that mechanism turns on.
    Institutional exclusion and gatekeeping are not supported by the sources consulted. Whether her
    early death or the displacement of credit did more to produce the interval is not established, and
    no claim is made about it.
  best_sources: [2, 3]
