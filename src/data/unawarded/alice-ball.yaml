  rationale:
    impact: The preparation was the most effective treatment for Hansen's disease in the first half of the twentieth century and allowed patients at Kalaupapa to return to their families.
    verification: Her own master's thesis survives and is published by her university, which also documents the method and its history.
    uniqueness: The water-soluble injectable form of the active chaulmoogra compounds was a distinct technical solution, developed when she was twenty-three.
    durability: The method was superseded by sulfone drugs in the mid-1940s, which bounds its durability as a technique even though its historical significance stands.
    breadth: The benefit reached a specific and severely affected patient population rather than a broad field.
    attribution: Her findings were published by another under his own name without mention of key research she conducted, and the method was renamed after him.
    observed_recognition: Nothing in her lifetime, decades of obscurity, then documented institutional restoration - a university medal in 2007, a state day in 2022, and designation of the Ball Method as a National Historic Chemical Landmark in 2026.
key_facts:
  - fact: Ball was the University of Hawaii's first African-American graduate and its first woman to earn a master's degree in chemistry, in 1915, and at twenty-three developed an injectable form of chaulmoogra oil for Hansen's disease.
    source: 2
  - fact: She died on 31 December 1916, at the age of twenty-four, before publishing her work.
    source: 3
  - fact: "The University of Hawaii records that Arthur Dean, president of the College of Hawaii, continued her work and published her findings but \"failed to mention key research she conducted\", mass-produced the treatment, was praised for the discovery, and called it \"The Dean Method\"."
    source: 2
  - fact: "In 1922 Harry T. Hollmann, the doctor at Kalihi Hospital who had encouraged Ball to work on chaulmoogra oil, published a paper attributing her process as the \"Ball Method\"."
    source: 2
  - fact: In 2007 the University of Hawaii Board of Regents posthumously awarded her its Medal of Distinction; in 2022 the Governor of Hawaii proclaimed 28 February "Alice Augusta Ball Day"; and in 2026 the Ball Method was designated a National Historic Chemical Landmark by the American Chemical Society.
    source: 4
analysis:
  - heading: An institution documenting its own displacement of credit
    body: "The central attribution claim here does not rest on a later reconstruction. The university whose president published her findings under his own name is the same institution that now records, in its own words, that he failed to mention key research she conducted and renamed the method after himself. Records that run against an institution's own interest are among the strongest evidence a corpus of this kind can hold."
  - heading: Restoration is part of the record, not a coda
    body: "The corpus treats the 1922 attribution, the 2007 medal, the 2022 state proclamation and the 2026 chemical landmark as recognition actually received, not as consolation. That is why her observed recognition is not scored near zero despite a lifetime that ended with none of it: the gap being measured is between contribution and recognition as the record now stands."
