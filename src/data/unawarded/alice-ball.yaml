title: Alice Ball
slug: alice-ball
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: Alice Ball developed the injectable chaulmoogra oil preparation that became the first effective treatment for Hansen's disease, died in 1916 at twenty-four before publishing it, and saw her work published by the president of her own college under his own name before credit was restored to her decades later.
introduction: The attribution record in this case comes from the institution whose own president took the credit, which makes it an unusually direct documentary basis for a credit claim.
omission_case: Her case matters because both halves of the sequence are institutionally documented - the displacement of credit and its later restoration - and because the recognition at issue has nothing to do with the Nobel system that dominates the rest of this corpus.
structural_reason: "The University of Hawaii's own record states that after her death Arthur Dean, president of the College of Hawaii, continued her work and published her findings while failing to mention key research she conducted, mass-produced the treatment, was praised for the discovery, and called it 'The Dean Method'. It also records the restoration: a 1922 paper by Harry T. Hollmann attributing the process as the 'Ball Method', and institutional honours from 2007 onward."
