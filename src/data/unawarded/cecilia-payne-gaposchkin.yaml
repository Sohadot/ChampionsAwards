analysis:
- heading: Resistance to the idea, then displaced credit
  body: Payne-Gaposchkin's gap combines two mechanisms the archive tracks separately - a result doubted and downplayed under senior pressure, and credit later flowing to that senior figure. Layered on institutional limits placed on women at her observatory, the case shows how opposition and displacement can compound.
