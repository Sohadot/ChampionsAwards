summary: Cecilia Payne-Gaposchkin showed in her 1925 thesis that stars are composed overwhelmingly of hydrogen and helium, but she was pressured to describe her own result as almost certainly not real, and credit for the conclusion later attached substantially to a senior astronomer.
introduction: Payne-Gaposchkin's doctoral work overturned assumptions about stellar composition, yet the recognition around it was shaped by senior opposition and by the constrained position of women in early twentieth-century astronomy.
omission_case: Her case matters because the record shows both a contribution being publicly doubted by an authority and that authority later reaching the same conclusion and receiving much of the credit.
structural_reason: Recognition was shaped by the deference demanded toward a senior figure and by the institutional limits placed on women at her observatory, which delayed her own standing for decades.
