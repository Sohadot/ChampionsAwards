  rationale:
    impact: "The machine the awarding state agency itself calls the world's first digital computer, built to break the cipher used between the most senior German commanders, and still in use by that agency into the early 1960s."
    verification: "High but deliberately not higher. The contribution is documented by the agency that held the secret and by the body that marked the site, and both are unambiguous about his role. The contemporaneous technical record that would ordinarily carry the strongest verification was destroyed by order, and that is a limit on this dimension rather than something to score around."
    uniqueness: "GCHQ names him as the engineer who designed it, and records that many of the experts working on it did not know what they were building. The design decision - that valves could be made to work reliably at that scale - was his, and no competing claimant exists."
    durability: "Scored below what the machine's priority would suggest, and for a documented reason. The machines were destroyed and the design was sealed, so the computers that shaped the field afterwards were developed without access to it. The contribution's endurance as an influence was itself curtailed by the same order that curtailed its author's recognition."
    breadth: The benefit reaches both the war's conduct and the development of computing, which is wider than a discipline-internal contribution.
    attribution: "Credit today is clear and is stated by the state agency itself. It is scored well below the corpus's uncontested cases because for roughly six decades the contribution could not be attributed to him at all, and the record from which attribution would normally be drawn was destroyed on instruction."
    observed_recognition: "The lowest figure in this domain by a wide margin, and the record is thin against the contribution. An MBE in 1943, for work that could not be described; an honorary degree in 1977; the inaugural Post Office Martlesham Medal in 1980; and, posthumously, a blue plaque and an eightieth-anniversary tribute from the agency that held the secret. No national academy, no major computing award in his lifetime, and no recognition at all attributable to the work for the first three decades after it."
key_facts:
  - fact: "GCHQ records that Colossus was overseen by Tommy Flowers, the engineer who designed it, that everyone who worked on it was sworn to the Official Secrets Act, and that many of the experts working on the computer had no idea what they were helping to build until it was installed."
    source: 1
  - fact: "GCHQ records that after the Second World War eight out of the ten machines were destroyed and that Flowers was ordered to hand over all documentation on the Colossus build."
    source: 1
  - fact: "GCHQ records that the machine's existence was only revealed in the early 2000s, after six decades of secrecy, and that Colossus was still being used by the agency in the early 1960s."
    source: 1
  - fact: "English Heritage records that for many years Flowers was largely unsung for his vital war work and key role in the development of the modern computer, owing to the secrecy surrounding Bletchley Park, and that the declassification of official papers brought belated recognition."
    source: 2
  - fact: "English Heritage records his honours: an MBE in 1943, an honorary degree from Newcastle University in 1977, and the inaugural Post Office Martlesham Medal in 1980."
    source: 2
analysis:
  - heading: A constraint the corpus documented before it could name it
    body: "Every element of this case is on the record, and the state agency that imposed the secrecy is the one that documents it. When the entry was first published, none of this project's six mechanisms fitted. Institutional exclusion describes a formal barrier to a position; no position was barred to him, and he held a senior engineering role throughout. Delayed recognition describes a community that could not absorb a contribution; this community was legally prevented from knowing it existed. Institutional gatekeeping describes a person with editorial or institutional authority obstructing dissemination; a wartime classification regime is not that person. The case was therefore recorded as standing on a boundary, and left there."
  - heading: How the mechanism arrived, and why the order matters
    body: "A second case - a peacetime idea, twenty-seven years later, in mathematics rather than engineering - reproduced the same shape and failed the same six tests for the same reasons. Only then did an ontology review over the completed corpus add compulsory secrecy, with five tests all of which must hold, and only then was this case tagged. No score moved, because no evidence changed. The sequence is the discipline: a mechanism created to fit the single case that prompted it would be a taxonomy built backwards from a result, which is the error this project removed from its Definition of Done in Cycle 01."
  - heading: Two cases, one context
    body: "This instance and the corpus's other compulsory-secrecy case both arise inside the same national cryptographic apparatus, and the corpus records that rather than counting them as two. Under the recurrence model adopted with the concept, lifecycle status is decided by independent contexts rather than by cases, so the mechanism stands at two cases and one context - emergent, not established. What would establish it is a case from a different regime, and the corpus does not have one."
  - heading: What the destruction order did to two different scores
    body: "The same instruction reduced two dimensions for two different reasons, and the entry keeps them apart. Verification is lower because the technical record that would normally anchor the contribution no longer exists. Durability is lower because the design was sealed rather than built on, so the computers that shaped the field afterwards owed it nothing. Neither is a judgment about the machine; both are consequences of an order, and both are stated rather than absorbed into a single narrative about neglect."
