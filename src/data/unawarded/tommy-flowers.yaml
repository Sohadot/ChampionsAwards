audit_exceptions:
  - claim: contribution
    search_date: '2026-09-12'
    search_note: >-
      No contemporaneous technical record of the Colossus design by its author exists to anchor this
      claim, because the agency's own account states that he was ordered to hand over all
      documentation and that eight of the ten machines were destroyed. His later published account of
      the design was not reached at a readable source. The contribution therefore rests on the state
      agency's own record and on the body that marked the site.
    best_source: 1
    reason: >-
      Institution-record-sufficient, and the absence is itself the finding. This is the only case in
      the corpus whose primary record was destroyed by instruction, and the verification score is
      lowered for exactly that reason rather than the gap being written around.
  - claim: mechanism-boundary
    search_date: '2026-09-12'
    search_note: >-
      Each of the six audit-eligible mechanisms was tested against this record and none is met on its
      published definition. No concept in the current ontology describes a contribution withheld from
      the record by statutory secrecy rather than by a barrier to a position, a community's inability
      to absorb it, or an actor's discretionary obstruction.
    best_source: 1
    reason: >-
      Recorded as an ontology boundary, not resolved by adding a concept. A mechanism created to fit
      the single case that motivated it would be a taxonomy built backwards from a result, which is
      the error this project removed from its Definition of Done in Cycle 01.
mechanism_audit:
  search_date: '2026-09-12'
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism is evidenced, and unlike the other unmechanised cases in this domain this one does
    carry a deficit: the gap is the largest in the domain and falls in the significantly
    under-recognised band. The finding is therefore unexplained under-recognition, and the reason is
    stated. Institutional exclusion is not tagged because its definition requires a formal barrier to
    an appointment, membership, authorship or pay, and he held a senior engineering post throughout;
    nothing was closed to him. Delayed recognition is not tagged because that mechanism turns on a
    receiving community unable or unready to absorb a contribution, whereas this community was
    legally prevented from knowing the contribution existed - the timing matches and the cause does
    not. Institutional gatekeeping is the closest fit and is still not tagged: it describes a person
    holding editorial, institutional or reviewing authority obstructing dissemination, and a wartime
    classification regime binding everyone involved under statute is a different object; tagging it
    would stretch a concept built for discretionary control inside a scientific community. Credit
    misattribution fails because no other person is documented as receiving his credit. Posthumous
    recognition is not tagged: some recognition did arrive after his death, but that mechanism turns
    on an eligibility rule foreclosing an award, and no such rule is in this record. The
    theory-experiment asymmetry does not apply. What this case establishes is a boundary in the
    ontology, recorded and deliberately not filled.
  best_sources: [1, 2]
