      withheld from the record by a formal classification regime. The exception is kept rather than
      deleted, because the sequence is the point: the boundary was recorded first, a second case in a
      different decade and technology reproduced it, and only then did an ontology review over the
      completed corpus add compulsory-secrecy.
    best_source: 1
    reason: >-
      Resolved by the ontology review of 2026-09-12, not by the entry that motivated it. A mechanism
