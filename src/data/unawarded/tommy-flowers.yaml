mechanism_audit:
  search_date: '2026-09-12'
  ontology_revision: MOR-005
  revision_basis: >-
    Audit performed at commit bd4083d under MOR-004 and extended at commit 69ffcc0, when compulsory
    secrecy entered the ontology as MOR-005 and this case was tested against it.
  reviewed: '2026-09-12'
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
    - compulsory-secrecy
  finding: mechanism-evidenced
  note: >-
    Compulsory secrecy is evidenced, and the tagging followed the ontology review rather than
    preceding it. When this entry was first published the corpus had no concept for a contribution
    withheld from the record by a formal classification regime, and the case was recorded as standing
    on a boundary rather than being forced into a neighbouring mechanism. The review over the
    completed corpus added the concept and this case now carries it; no score changed, because nothing
    about the evidence changed. All five of the mechanism's tests hold: everyone who worked on
    Colossus was sworn to the Official Secrets Act; the contribution itself was covered by that
    obligation; dissemination was not merely discouraged but prevented, with eight machines destroyed
    and the documentation handed over on instruction; the absence of visibility was a legal regime
    rather than editorial discretion or low uptake; and the effect on recognition is evidenced
    separately by the body that marked the site, which records that he was largely unsung for decades
    owing to the secrecy and that declassification brought belated recognition. The three neighbouring
    mechanisms remain refused for the reasons first recorded here. Institutional exclusion requires a
    formal barrier to an appointment, membership, authorship or pay, and he held a senior engineering
    post throughout. Delayed recognition turns on a receiving community unable or unready to absorb a
    contribution, and this one was legally prevented from knowing it existed. Institutional
    gatekeeping turns on a person exercising editorial or institutional discretion, and a
    classification regime binds everyone involved including that person. Credit misattribution fails
    because no other person is documented as receiving his credit, and posthumous recognition because
    no eligibility rule foreclosed an award. This instance is recorded in the
    uk-government-cryptographic-secrecy context, which is what keeps it from being counted as an
    independent replication of the same mechanism in the corpus's other secrecy case.
  best_sources: [1, 2]
