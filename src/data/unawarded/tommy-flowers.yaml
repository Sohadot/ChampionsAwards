audit_exceptions:
  - claim: contribution
    search_date: '2026-09-12'
    search_note: >-
      No contemporaneous technical record of the Colossus design by its author exists to anchor this
      claim, because the agency's own account states that he was ordered to hand over all
      documentation and that eight of the ten machines were destroyed. His later published account of
      the design was not reached at a readable source. The contribution therefore rests on the state
      agency's own record and on the body that marked the site.
    best_source: 1
    reason: >-
      Institution-record-sufficient, and the absence is itself the finding. This is the only case in
      the corpus whose primary record was destroyed by instruction, and the verification score is
      lowered for exactly that reason rather than the gap being written around.
  - claim: mechanism-boundary
    search_date: '2026-09-12'
    resolved_date: '2026-09-12'
    search_note: >-
      When this entry was published, each of the six audit-eligible mechanisms was tested against this
