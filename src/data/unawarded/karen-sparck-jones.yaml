    search_note: "Sought the awarding bodies' own citation records for the Salton Award, the ACL Lifetime Achievement Award, the Lovelace Medal and the Allen Newell Award. The ACM pages that would carry two of them returned HTTP 403 to this audit, as they did in the Cycle 03 requalification of the Turing Award. The honours are listed together by a scholarly obituary in the field's journal of record and, in part, by her own department."
    best_source: 2
    reason: "Secondary-record-sufficient. The list of honours is taken from a peer-reviewed obituary rather than from each awarding body, and no individual citation wording is quoted here, since none was read at source."
