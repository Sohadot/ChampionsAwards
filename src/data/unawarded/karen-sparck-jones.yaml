  rationale:
    impact: "The 1972 paper argued that index terms should be weighted by collection frequency, and her obituary in the field's journal of record describes the resulting measure as the partial basis of all weighting schemes adopted by widely used internet search engines. The entry keeps the qualifier - partial basis - rather than dropping it."
    verification: The contribution is anchored to her own paper, published under her name from the Cambridge Computer Laboratory, and is independently described by a scholarly obituary and by her department.
    uniqueness: The obituary calls inverse document frequency her invention, and the statistical reading of term specificity as a function of term use rather than term meaning is the specific step the paper takes.
    durability: The measure is still standard in retrieval more than half a century after the paper, and the paper was reprinted in the same journal in 2004.
    breadth: Retrieval weighting reaches ordinary users of search rather than specialists only, which places the benefit wider than a discipline-internal contribution.
    attribution: "Credit is uncontested and is routinely attached to her name in the literature and in the pairing that names the weighting model after her and a collaborator. It is scored below the corpus's clearest attribution cases for one reason: the measure itself is used far more often than it is credited, which is diffusion without displacement rather than misattribution."
    observed_recognition: "The premier lifetime award of information retrieval, the premier lifetime award of computational linguistics, the British Computer Society's medal, a joint society award, a national academy fellowship, two artificial intelligence fellowships, the presidency of her field's association, and a readership and then a personal chair at her university. Scored below the corpus's alignment cases because the university standing arrived after more than three decades and the award cluster fell late relative to the 1972 work, and well above its exclusion cases because the honours were numerous, independent of one another and received in her lifetime."
key_facts:
  - fact: "In the 1972 paper she argued that specificity should be interpreted statistically, as a function of term use rather than of term meaning, and that terms should be weighted according to collection frequency so that matches on less frequent, more specific terms are of greater value than matches on frequent terms."
    source: 1
  - fact: The paper was published from the Computer Laboratory at the University of Cambridge in the Journal of Documentation in 1972, and was reprinted in the same journal in 2004.
    source: 1
  - fact: "Her obituary in Computational Linguistics states that she joined the Cambridge Language Research Unit in 1957 and so began a very lengthy period on soft money, and that the University of Cambridge finally recognised her standing by awarding her a readership in 1994 and a personal chair in 1999."
    source: 2
  - fact: "The same obituary lists her honours as fellowships of the American and European artificial intelligence societies, fellowship of the British Academy, the ACL Lifetime Achievement Award, the Lovelace Medal of the British Computer Society, the ACM SIGIR Salton Award, the American Society for Information Science and Technology's Award of Merit, the ACM-AAAI Allen Newell Award, and the ACM Women's Group Athena Award, which she did not live to receive formally."
    source: 2
  - fact: "The obituary records that she felt she was never overtly discriminated against as a woman, and that she noted she was very frequently the only woman in professional circles."
    source: 2
  - fact: Her department records her as Professor of Computers and Information, emeritus, and as President of the Association for Computational Linguistics in 1994.
    source: 3
analysis:
  - heading: Two records that do not agree
    body: "Most cases in this corpus have a recognition record and an institutional record that point the same way, and the instrument reads them together. Here they diverge. By the measure this project actually uses - formal recognition received - her record is dense, independent and contemporaneous, and the computed gap is small. By the measure this project does not use - employment standing at her own institution - the record is thirty-seven years of short-term funding before a readership. The entry reports the first and documents the second without scoring it as a mechanism."
  - heading: A negative finding that is stated, not inferred
    body: "A case with this shape invites the assumption that the late post was a gendered barrier. The source closest to her states the opposite on her own behalf: that she felt she was never overtly discriminated against, while being very frequently the only woman present. This corpus does not have standing to overrule a subject's recorded account of her own career with an inference drawn from its shape, and it does not do so here. No formal barrier to an appointment is documented, which is what the exclusion mechanism requires, so the mechanism is tested and not tagged."
  - heading: What the second computing case does and does not establish
    body: "Computing now holds two cases and both return small gaps, and it would be easy to read that as a property of computing as a recognition environment. Two cases establish nothing of the kind. The first was entered as a deliberate award-positive control, and the second was entered because its outcome could not be predicted, which is the only sense in which the pair is informative at all. What they jointly establish is that the side of the domain that began at zero now has a measured range, not that the range is representative."
