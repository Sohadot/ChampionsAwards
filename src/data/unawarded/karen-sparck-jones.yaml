    search_note: "Sought University of Cambridge records of her appointments. The department publishes her final title but not the dates of her readership or chair; those dates, and the characterisation of the preceding period as soft money, come from the obituary, which also reports her own view of whether she was discriminated against."
    best_source: 2
    reason: "Reported rather than archival. The employment record is stated as the obituary states it, and no mechanism is derived from it, so the claim does not carry a score."
mechanism_audit:
  search_date: '2026-09-12'
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism is evidenced, and the computed gap is small enough that the case falls in the band
    where recognition roughly matches assessed merit rather than in unexplained under-recognition.
    Institutional exclusion was the mechanism this case was most likely to support and it is not
    tagged: the definition requires a formal barrier to an appointment, membership, authorship or pay,
    and what is documented is a long period of short-term funding followed by a readership and a chair,
    with no rule or refusal in the record, against her own reported statement that she was never overtly
    discriminated against. Credit misattribution is not tagged, since no source displaces the 1972
    result to anyone else and the weighting model carries her name. Delayed recognition was tested
    because the honours cluster falls between sixteen and thirty-five years after the paper, and is not
    tagged, because the mechanism concerns a community's inability to absorb the work, whereas this
    work was absorbed quickly and the awards in question are lifetime awards, which are late by
    construction. Gatekeeping, posthumous recognition and the theory-experiment asymmetry are
    unsupported.
  best_sources: [1, 2]
