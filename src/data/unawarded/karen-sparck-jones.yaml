title: Karen Sparck Jones
slug: karen-sparck-jones
status: published
last_reviewed: 2026-09-12
domain: mathematics-computing
subfield: computing
summary: Karen Sparck Jones introduced inverse document frequency in a 1972 paper written at the Cambridge Computer Laboratory, collected the highest lifetime honours of two research communities, and spent thirty-seven years without an established university post - which makes her the case that separates recognition from employment standing.
introduction: This is the second case entered on the computing side of the domain, and it was chosen because its recognition record is neither a clear omission nor a clear alignment in advance of measurement, so the instrument has to decide rather than confirm.
omission_case: "Her case matters because two records that usually move together pull apart in it. Her professional recognition is dense and arrived in her lifetime - the premier lifetime award of information retrieval, the premier lifetime award of computational linguistics, a national academy fellowship and a national society's medal. Her institutional standing at her own university was a readership at fifty-nine and a personal chair at sixty-four, after more than three decades on short-term research funding. The entry exists to test which of those the instrument is actually measuring."
structural_reason: "No structural reason is offered, and none is evidenced. The employment record is documented and is deliberately not converted into a recognition mechanism here. Her obituary in the field's journal of record states that she joined the Cambridge Language Research Unit in 1957 and so began a very lengthy period on soft money, and that the university awarded her a readership in 1994 and a personal chair in 1999. The same source records her own position: that she felt she was never overtly discriminated against as a woman, while noting that in professional circles she was very frequently the only woman. This entry records both statements and derives no mechanism from either."
