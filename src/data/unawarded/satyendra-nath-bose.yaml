key_facts:
- fact: In 1924 Bose derived a new quantum statistics, which Einstein translated into German and submitted for publication.
  source: 1
- fact: The term boson was later coined after Bose, and he did not receive a Nobel Prize.
  source: 2
- fact: The Nobel nomination archive records Bose as a nominee in eleven nominations for the Nobel Prize in Physics between 1956 and 1972, by nominators including K. Banerji, D. S. Kothari, S. Bagchi, A. Dutta, L. Kothari and M. G. K. Menon.
  source: 4
analysis:
- heading: Recognition that partly succeeded
  body: Bose's gap is deliberately modest in this archive. His name is woven into physics, so the case is not one of erasure but of dependence - his result travelled only once a metropolitan intermediary vouched for it. Including such cases keeps the index honest and resistant to a bias toward dramatic injustice alone.
