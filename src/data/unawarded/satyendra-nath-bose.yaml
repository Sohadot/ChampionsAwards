mechanism_audit:
  search_date: '2026-09-10'
  considered:
  - credit-misattribution
  - institutional-exclusion
  - institutional-gatekeeping
  - delayed-recognition
  - theory-experiment-asymmetry
  - recognition-bias
  finding: no-mechanism-evidenced
  note: >-
    Audited against every published mechanism in the ontology, and none is supported by the record for
    this case. Credit misattribution does not hold: the statistics and the boson carry his name.
    Institutional exclusion does not hold: he held professorial positions, was elected FRS in 1958 and
    made National Professor. Institutional gatekeeping was tested against the documented rejection of
    the 1924 manuscript by Philosophical Magazine after a negative referee report; the record shows a
    rejection, not the active obstruction the mechanism requires, and no referee report or editorial
    record was found that would establish one. What the record does show is the opposite of an absent
    process: the Nobel nomination archive lists him as a nominee in eleven Physics nominations between
    1956 and 1972, and a historian working from the Nobel archives reports that the committee
    commissioned an expert evaluation from Oskar Klein in 1956 which judged the contribution important
    but below the standard of the awarded work. The gap in this case therefore sits between our
    assessment and a documented evaluation, not between a contribution and a process that ignored it.
    Scores are unchanged: new evidence about the recognition record is not a reason to move a score.
  best_sources:
  - 4
  - 5

