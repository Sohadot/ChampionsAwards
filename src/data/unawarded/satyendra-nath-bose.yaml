domain: physics-astronomy
summary: Satyendra Nath Bose derived the quantum statistics that underpin Bose-Einstein statistics and the boson, work whose importance was recognised largely because Einstein translated and championed it, and Bose never received a Nobel Prize.
introduction: Bose's 1924 derivation reached the physics community through Einstein's mediation, and while his name became embedded in the vocabulary of physics, the case is a useful test of a smaller, more nuanced recognition gap.
omission_case: His case matters precisely because recognition partly succeeded, so it guards the archive against selecting only dramatic omissions and shows how eponymous fame can coexist with a lack of the field's highest honours.
structural_reason: Recognition was shaped by his position outside the European metropolitan centres, which meant his result gained traction only after a famous intermediary vouched for it.
