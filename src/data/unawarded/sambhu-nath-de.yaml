audit_exceptions:
  - claim: observed-recognition
    search_date: '2026-09-11'
    search_note: "Searched the WHO institutional repository and the Nobel nomination archive for records of honours or nominations. The nomination archive publishes Physiology or Medicine nominations only through 1953, so nominations attributed to the 1970s cannot be checked; WHO's repository returned no record naming him beyond the Bulletin republication. Career details reported in secondary literature - his headship at Calcutta Medical College, his retirement in 1973 and his death in 1985 - were not anchored institutionally and are therefore not stated as facts in this entry."
    best_source: 4
    reason: "Known-status: the contribution is anchored primarily and institutionally, the recognition record is not, and the entry says so rather than filling the gap with reported detail."
mechanism_audit:
  search_date: '2026-09-11'
  considered:
    - credit-misattribution
    - institutional-exclusion
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
  finding: no-mechanism-evidenced
  note: >-
    No mechanism in the ontology is supported by the record reached here. Credit misattribution fails:
    no rival claimant took the discovery, and the specialist literature attributes it to him.
    Institutional exclusion fails on evidence, not on plausibility - he held a departmental position
    and published in Nature, and nothing reached in this audit documents a formal barrier. Delayed
    recognition is the closest candidate and is still not tagged: international standing came within
    his working life, and the later republication by WHO is an institutional acknowledgment rather
    than a delayed arrival of recognition that had been withheld. Gatekeeping and posthumous rules are
    unsupported. The corpus notes, without tagging it, that this is the second case in the archive -
    with Bose in physics - where a contribution made outside the metropolitan centres of a field
    returns no evidenced mechanism. Whether that is a pattern or an artefact of two cases is a
    question for the ontology review, not a finding.
  best_sources: [2, 3]
