  rationale:
    impact: Establishing that the disease is produced by a toxin rather than by the organism itself reframed cholera pathogenesis and the rationale for rehydration therapy.
    verification: Two primary publications carry the finding, and the World Health Organization republished the 1953 paper in its Bulletin.
    uniqueness: The exotoxin was demonstrated seventy-five years after the organism was identified, and his ileal-loop demonstration is the step the later literature builds on.
    durability: Cholera toxin remains a central object of microbiology and a standard teaching example of toxin-mediated disease.
    breadth: The benefit reaches diarrhoeal disease globally, a field of very large public-health consequence.
    attribution: Credit for the discovery is consistently his in the specialist literature.
    observed_recognition: International standing among specialists and republication by WHO, against a thin formal honours record and, in the words of the journal of India's own medical research council, work that "remained unsung and unnoticed" at home.
key_facts:
  - fact: "De and Chatterje published \"An experimental study of the mechanism of action of Vibrio cholerae on the intestinal mucous membrane\" in the Journal of Pathology and Bacteriology in 1953."
    source: 1
  - fact: "De published \"Enterotoxicity of bacteria-free culture-filtrate of Vibrio cholerae\" in Nature in 1959, volume 183, pages 1533-1534."
    source: 2
  - fact: The Bulletin of the World Health Organization republished the 1953 paper in 2010, volume 88, pages 239-240.
    source: 3
  - fact: "The Indian Journal of Medical Research records that he received international recognition for this work, including a Nobel Prize nomination attributed to Joshua Lederberg, while \"back home in India, his work remained unsung and unnoticed\"."
    source: 4
analysis:
  - heading: A recognition claim that cannot be checked, recorded as such
    body: "The most repeated statement about De is that he was nominated for the Nobel Prize. The corpus cannot verify it: the Nobel nomination archive publishes Physiology or Medicine nominations only through 1953, and any nomination of De would fall decades later. The claim is therefore recorded with its source and its limitation, and it carries no weight in his observed-recognition score. A nomination is not recognition conferred in any case."
  - heading: Why no mechanism is tagged
    body: "It would be easy to write that a scientist working in Calcutta in the 1950s was overlooked because he worked in Calcutta. The corpus does not have the evidence for that sentence in this case, and the sentence is exactly the kind that sounds explanatory while resting on nothing checkable. What is documented is a contribution of the first rank, international standing among specialists, republication by a global health authority, and a thin formal honours record. The mechanism behind that combination is not recorded here."
