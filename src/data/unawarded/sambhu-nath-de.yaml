title: Sambhu Nath De
slug: sambhu-nath-de
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: Sambhu Nath De, working in Calcutta, showed in 1953 that Vibrio cholerae acts on the intestinal mucous membrane through a ligated ileal-loop model and in 1959 that a bacteria-free culture filtrate reproduced the effect, establishing cholera as a toxin-mediated disease - work the World Health Organization later republished in its Bulletin.
introduction: This entry was opened to move the corpus outside Western institutions and outside the Nobel-centred narrative that dominates the rest of it. The recognition question is approached from the work outward, not from an assumed injustice inward.
omission_case: "His case matters because the contribution is anchored twice in primary literature and once institutionally, while the recognition record is thin and much of what is said about it circulates as claim rather than record - which is exactly the situation the corpus's rules were built to handle."
structural_reason: "The record establishes a contribution and a sparse recognition trail, and does not establish a reason for the sparseness. This entry makes no claim that recognition was withheld deliberately, and it declines to treat his location outside the metropolitan centres of the field as a mechanism, because the corpus has no evidence tying the two together in this case."
