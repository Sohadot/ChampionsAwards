    source: 2
  - fact: Meitner and her nephew Otto Frisch published the physical interpretation of fission in 1939.
    source: 1
  - fact: Element 109, meitnerium (Mt), was named in her honour.
    source: 3
analysis:
  - heading: Why the recognition gap is structural, not incidental
    body: The fission result sat on the seam between chemistry and physics, and the prize architecture forced it onto one side. Combined with Meitner's exile, which removed her from the bench where the work was completed, the division of credit followed the shape of institutions rather than the shape of the contribution - the exact pattern this archive exists to document.
