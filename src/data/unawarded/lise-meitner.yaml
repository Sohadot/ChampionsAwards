title: Lise Meitner
slug: lise-meitner
status: published
last_reviewed: 2026-09-08
summary: Lise Meitner co-developed the theoretical explanation of nuclear fission, yet the 1944 Nobel Prize in Chemistry for the discovery was awarded solely to her long-time collaborator Otto Hahn.
introduction: Meitner's case is among the most documented in the history of scientific recognition, because the physics she and Otto Frisch interpreted was inseparable from the chemistry that was honored, and yet the two were institutionally divided.
omission_case: Her exclusion from the 1944 Chemistry prize matters because the fission result depended on a physical interpretation she supplied, making the omission a question about how disciplinary boundaries decide credit.
structural_reason: Recognition was shaped by wartime displacement, the separation of physics from chemistry in the prize architecture, and Meitner's forced emigration from Nazi Germany, which severed her from the laboratory where the experiments continued.
