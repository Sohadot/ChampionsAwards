title: Andrew Wiles
slug: andrew-wiles
status: published
last_reviewed: 2026-09-12
domain: mathematics-computing
subfield: mathematics
summary: Andrew Wiles proved Fermat's Last Theorem in a 1995 paper in the Annals of Mathematics, was too old for the Fields Medal under a rule the International Mathematical Union publishes and the 1998 Congress applied to him in writing, and holds one of the most complete recognition records in this corpus.
introduction: This entry exists to test one proposition that the corpus has never been able to examine directly - whether a documented eligibility constraint produces a measurable recognition deficit - and it deliberately assesses his recognition across the whole of mathematics rather than against the single award the rule excluded him from.
omission_case: "His case matters because the chain runs rule, then event, then institutional record, rather than being inferred backwards from a prize he did not receive. The union publishes the age rule; the Congress's own press office stated in 1998 that the timing was too late for the Fields Medal because he was then over the age limit of forty; and the union offered him a silver plaque instead, which it records in the medalists list. Almost nothing else in this corpus has that shape."
structural_reason: "A formal eligibility rule is documented and was applied to him, and it is recorded here as a rule rather than as a mechanism. The corpus's mechanism ontology has no concept for an eligibility constraint that operates without producing a deficit, and inventing one to fit this case would be fitting the ontology to a result. The constraint is therefore recorded where temporal validity belongs, in the provenance block for the 1998 outcome, tied to the rule as it stood at that date."
