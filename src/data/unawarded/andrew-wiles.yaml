    basis: awarding-institution-record
    rule_at_time:
      event_date: 1998
      effective_from: 1966
      rule_in_force: >-
        At the 1998 Congress the Fields Medal was governed by the fortieth-birthday rule - a
        candidate's fortieth birthday must not occur before 1 January of the Congress year - which the
        International Mathematical Union publishes in the same form today. The Congress's own press
        office stated at the time that the completion of the proof came too late for the Fields Medal
        because he was then over the age limit of forty, which records the rule as applied at that
        date rather than as it reads now. The corpus's entry for the medal dates the codification of
        the age limit to 1966 on a scholarly account, and carries its own exception for the absence of
        a union document giving that date.
      record_anchor: [2, 3]
audit_exceptions:
  - claim: fields-medal-1998-ineligibility
    search_date: '2026-09-12'
    search_note: "Sought a union document stating that he was assessed and found ineligible, as distinct from the published rule and the Congress's public explanation. The union publishes the rule and records the silver plaque; it does not publish committee deliberations, and none was reached. No claim is made here about what the committee considered."
    best_source: 2
    reason: "Deliberation not reached. The entry claims the rule, its application as stated publicly at the Congress, and the tribute that was given instead; it does not assert a committee rationale."
mechanism_audit:
  search_date: '2026-09-12'
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism is evidenced, and the gap is negative, so the case falls in the band where recognition
    roughly matches assessed merit rather than in unexplained under-recognition. The finding needs one
    qualification that the vocabulary cannot carry on its own. A formal eligibility constraint is
    documented here more firmly than in any other case in the corpus, and it is not among the six
    mechanisms, because every one of them describes a route by which deserved recognition fails to
    arrive, and here it arrived in quantity from every other direction. Institutional exclusion was
    tested most carefully and is not tagged: its definition turns on barriers to appointments,
    authorship, membership or pay, which shape the record from which honours are drawn, whereas an age
    rule bars a candidate from one award while leaving the rest of the record untouched - and his
    record is as complete as the corpus has seen. Delayed recognition fails because the field absorbed
    the proof immediately and honoured it continuously from 1989 onward. Credit misattribution,
    gatekeeping, posthumous recognition and the theory-experiment asymmetry are all unsupported.
  best_sources: [1, 2, 3]
