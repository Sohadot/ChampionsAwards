  rationale:
    impact: "The proof settled a question open since the seventeenth century and did so by establishing modularity for semistable elliptic curves; the Abel citation describes the result as opening a new era in number theory, and the technique introduced to obtain it became a standard instrument in the field."
    verification: The contribution is anchored to the paper itself in the journal that published it, and the proof was checked, found to contain a gap, repaired in a companion paper and then accepted by the field - a verification history that is unusually explicit and entirely public.
    uniqueness: The modularity lifting argument was his own and had no competing claimant; the corpus records that the final step was completed jointly, which is stated in the record rather than contested.
    durability: The theorem is permanent and the method is in continuous use, and the honours awarded two decades later cite the same result.
    breadth: "This is the lowest breadth score in the corpus and it is deliberate: the benefit is deep inside mathematics rather than wide across society. The instrument penalises discipline-internal work, and this entry is the clearest illustration of that property in the corpus."
    attribution: Credit is unambiguous and uncontested, the result carries his name, and the shared authorship of the repairing paper is part of the public record rather than a disputed boundary.
    observed_recognition: "The highest figure in this corpus. Fellowship of the national academy of science from 1989, a knighthood in 2000, that academy's premier award and its royal medal, the Shaw Prize, the Wolf Prize, the King Faisal International Prize, the Abel Prize in 2016, and a one-off silver plaque created by the international union of his own discipline when its rules would not let it give him its medal."
key_facts:
  - fact: "The proof was published as \"Modular elliptic curves and Fermat's Last Theorem\" in the Annals of Mathematics, volume 141, in 1995."
    source: 1
  - fact: "The International Mathematical Union states the eligibility rule as: a candidate's fortieth birthday must not occur before 1 January of the year of the Congress at which the Fields Medals are awarded."
    source: 2
  - fact: "The union's chronological list of medalists records, against 1998, that a silver plaque was offered to Andrew J. Wiles as a special tribute from the IMU."
    source: 2
  - fact: "The 1998 Congress's press office announced on 18 August 1998 that he had been honoured with the IMU silver plaque, presented by the chairman of the Fields Medals Committee at the opening ceremony, and stated that the completion of the proof came too late for the Fields Medal because he was then over the age limit of forty."
    source: 3
  - fact: "The Norwegian Academy of Science and Letters awarded him the Abel Prize for 2016 for his stunning proof of Fermat's Last Theorem by way of the modularity conjecture for semistable elliptic curves, opening a new era in number theory."
    source: 4
  - fact: "The Royal Society records his election as a Fellow in 1989, his knighthood in 2000, its Copley Medal for his beautiful and unexpected proof of Fermat's Last Theorem, its Royal Medal, and his Shaw Prize, Wolf Prize and King Faisal International Prize."
    source: 5
analysis:
  - heading: A constraint that is real and a deficit that is not there
    body: "The eligibility rule is not in doubt. It is published by the union, it was applied to him, and the union went so far as to create a one-off object to mark what its own rule prevented. The measured outcome is nonetheless a small negative gap, which the bands classify as recognition roughly matching assessed merit. Both statements are true at once, and the corpus has not previously been able to show that they can be. A mechanism or a constraint may be real, documented and consequential for one award without producing a present recognition deficit across the field."
  - heading: Why the assessment is not made against the Fields Medal
    body: "It would have been easy, and wrong, to score his observed recognition against the one award the rule excluded him from and report a deficit. The Fields Medal is one eligibility system inside mathematics, not the whole of mathematical recognition. The score here reads the entire record - a national academy, a state honour, four international prizes and the union's own bespoke tribute - which is the only reading that can distinguish an excluded candidate from an unrecognised one."
  - heading: What this case exposes about the instrument
    body: "His breadth score is the lowest the corpus has recorded, because the benefit of the work sits inside mathematics. That single dimension is most of the reason the index lands below the recognition, and it is worth stating plainly rather than leaving in the arithmetic: an instrument that weights benefit to society will read a discipline-internal result as less deserving than the discipline itself does. That is a property of the DDI, not a finding about him."
