    source: 1
analysis:
  - heading: When the channel decides the credit
    body: "Zweig's gap has two layers - a simultaneous discovery that shared credit, and active gatekeeping that delayed his version entering the literature. The second is the sharper point: when a gatekeeper controls whether and where work appears, priority is decided by access rather than by the contribution."
