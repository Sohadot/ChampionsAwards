summary: George Zweig independently proposed the quark model in 1964, which he called aces, but his manuscript was obstructed from journal publication at CERN, and the credit for the idea attached largely to Murray Gell-Mann.
introduction: Working at CERN in 1964, Zweig arrived at the same underlying constituent model as Gell-Mann, yet institutional resistance to publishing it shaped how the discovery entered the record.
omission_case: His case matters because it combines a simultaneous discovery with active obstruction of publication, making it a clear study of how control over channels decides credit.
structural_reason: Recognition was shaped by pressure over where and whether to publish, by the absence of an established reputation, and by the concentration of credit on the better-known co-originator.
