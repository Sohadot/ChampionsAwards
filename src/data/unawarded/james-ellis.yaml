  - claim: contribution
    search_date: '2026-09-12'
    search_note: >-
      Sought a readable text of the January 1970 report and of his own later account of the work.
      GCHQ released both in 2016, and the archival catalogue record gives the document's issuing body,
      number, date and original classification, but no readable copy was reached by this audit.
    best_source: 1
    reason: >-
      Archival-record-sufficient. What is claimed - the document, its date, its author and its
      classification - is exactly what the catalogue record establishes, and no claim is made about
      the report's internal argument.
  - claim: observed-recognition
    search_date: '2026-09-12'
    search_note: >-
      Searched for any award, fellowship, medal or honour attributable to this work. None was found,
      and none appears in the agency's own account of him. The absence is consistent with the record:
      the work was classified until a month after his death.
    best_source: 2
    reason: >-
      Known-status. The score rests on the absence of honours together with the documented
      institutional acknowledgements of 1997 and 2016, and the entry treats acknowledgement of a
      work's existence as different from recognition of its author.
  - claim: mechanism-boundary
    search_date: '2026-09-12'
    resolved_date: '2026-09-12'
    search_note: >-
      When this entry was published, each of the six then-eligible mechanisms was tested against this
      record and none was met, for the same reasons recorded in the corpus's other secrecy case. The
      exception is kept rather than deleted, because the order is the point: this case was published
      as a recurrence of an unnamed boundary, and the ontology review that followed over the completed
      corpus added compulsory-secrecy.
    best_source: 2
    reason: >-
      Resolved by the ontology review of 2026-09-12. The concern that prompted the deferral stands and
      is now measured rather than argued: both cases arise inside one national cryptographic
      apparatus, so the mechanism is recorded at two cases and one independent context, and is
      emergent rather than established.
mechanism_audit:
  search_date: '2026-09-12'
  reviewed: '2026-09-12'
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
    - compulsory-secrecy
  finding: mechanism-evidenced
  note: >-
    Compulsory secrecy is evidenced, and as in the corpus's other case of this shape the tagging
    followed the ontology review rather than preceding it. This entry was published carrying no
    mechanism, because none of the six then-eligible concepts fitted; it was its reproduction of an
    already-recorded boundary that gave the review the grounds to act. No score changed, because
    nothing about the evidence changed. All five tests hold: a formal classification obligation
    existed, the January 1970 report being issued as a research report classified Secret; the
    contribution itself was covered by it; dissemination was prevented rather than discouraged, the
    work being made available at first only for official governmental communications and announced
    publicly only in December 1997; the absence of visibility was a classification regime rather than
    editorial discretion, low uptake or contested attribution; and the effect on recognition is
    evidenced separately - no honour attributable to this work exists in any record read here, and the
    public announcement came a month after his death. The neighbouring mechanisms remain refused for
    the reasons first recorded here. Institutional exclusion fails because he was an agency employee
    from 1952 with nothing barred to him. Delayed recognition fails on cause rather than timing: this
    community was demonstrably able to absorb the idea, having produced it independently within about
    six years, but was legally prevented from knowing his existed. Institutional gatekeeping fails
    because a classification regime binds everyone involved rather than being a person exercising
    discretion. Credit misattribution was tested hardest of all, because the field's highest award for
    public-key cryptography is held by other people, and is still refused: independent arrival by
    another route is not displacement, which is what that definition requires. Posthumous recognition
    fails because no eligibility rule foreclosed an honour. This instance is recorded in the
    uk-government-cryptographic-secrecy context - the same context as the corpus's other case - which
    is precisely what stops two observations being counted as two independent replications.
  best_sources: [1, 2]
