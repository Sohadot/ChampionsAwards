title: James H. Ellis
slug: james-ellis
status: published
last_reviewed: 2026-09-12
domain: mathematics-computing
subfield: computing
summary: James Ellis conceived non-secret encryption - what the world later called public-key cryptography - in a GCHQ research report classified Secret in January 1970; the work stayed classified until December 1997, a month after he died, and his own papers were released only in 2016.
introduction: This entry was opened to test whether the boundary the Flowers case exposed - a contribution withheld from the record by statutory secrecy, which none of this project's six mechanisms describes - is a single anomaly or something that recurs in a different decade and a different technology.
omission_case: "His case matters because it repeats a shape the corpus could not name, under conditions that are otherwise unlike the earlier one: not a wartime machine but a peacetime idea, not 1943 but 1970, not engineering but mathematics. What it shares is the mechanism of concealment and the institution imposing it. Whether that makes the shape a mechanism or makes it one regime's signature is a question this entry deliberately does not answer."
structural_reason: "The documented constraint is classification, recorded as that and not as one of this corpus's mechanisms. The archival record shows his January 1970 report issued by the Communications-Electronics Security Group at GCHQ as Research Report No. 3006 and classified Secret. GCHQ's own account states that the discovery remained classified for a long time, was at first made available only for official governmental communications, and was publicly announced in December 1997 - and that Ellis died on 25 November 1997, a month before that announcement. No position was closed to him; he was a GCHQ employee from 1952 and did the work there."
