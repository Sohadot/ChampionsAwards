  rationale:
    impact: "The concept underlies what GCHQ describes as the basis for all secure transactions on the internet. It is scored below the corpus's most infrastructural cases for a documented reason rather than a cautious one: he conceived the possibility, colleagues produced the methods, and the systems actually deployed descend from the independent public line rather than from his sealed report."
    verification: "The contribution is anchored by an archival record giving the issuing body, report number, date and original classification, and by the awarding state agency's own account of what he conceived and when."
    uniqueness: "The most sharply bounded uniqueness in this corpus, and bounded by an event rather than by judgment. He reached the concept first, and the public research community reached it independently within about six years without any knowledge of his work. A counterfactual that actually occurred is the strongest possible limit on counterfactual uniqueness, and the entry scores it as one."
    durability: The idea endures completely; his particular formulation did not propagate, because it was sealed, so what endures descends from the independent line rather than from his report.
    breadth: Among the widest in this corpus. Public-key cryptography reaches every person who uses a secure connection, which is a different order of reach from a discipline-internal result.
    attribution: "The lowest attribution score in this corpus. Credit for public-key cryptography is attached in the world's naming to the people who published it, and his priority exists as an institutional acknowledgement made in 1997 rather than as attribution carried by the technology. His own papers reached the public record in 2016, forty-six years after they were written."
    observed_recognition: "The lowest figure in this domain. No award, no fellowship, no honour attributable to this work appears in any record read here, and none could have: it was classified until a month after his death. What exists is institutional acknowledgement - the agency's 1997 announcement of its own priority, its published account of him, and the 2016 release of his papers. That is recognition of the work's existence rather than recognition of its author."
key_facts:
  - fact: "The archival record gives the document as J. H. Ellis, Communications-Electronics Security Group, Government Communications Headquarters, Research Report No. 3006, \"The Possibility of Secure Non-Secret Digital Encryption\", January 1970, classified Secret."
    source: 1
  - fact: "GCHQ states that Ellis conceived of the possibility of non-secret encryption, now more commonly known as public-key cryptography, and that he joined the agency in 1952."
    source: 2
  - fact: GCHQ states that he worked closely with his colleague Clifford Cocks, who developed what became known as the RSA asymmetric key encryption algorithm, and that the agency's mathematician Malcolm Williamson pioneered a process of key exchanges.
    source: 2
  - fact: "GCHQ states that the discovery in 1973 remained classified for a long time and was at first only made available for official governmental communications, and that the public announcement was made in December 1997."
    source: 2
  - fact: "GCHQ states that Ellis died on 25 November 1997, aged 73, a month before the public announcement of the achievement was made."
    source: 2
  - fact: GCHQ describes public-key cryptography as now the basis for all secure transactions on the internet.
    source: 2
analysis:
  - heading: The case that turned a boundary into a mechanism
    body: "This entry was published carrying no mechanism. It is the second case in this domain whose recognition deficit is produced by a formal secrecy regime, and when it appeared none of the six audit-eligible concepts fitted it, for the same reasons as the first: no position was barred, so exclusion failed; the receiving community was legally prevented from knowing rather than unable to absorb, so delayed recognition failed on its cause even where it matched on timing; and a classification regime binding everyone is not the person exercising discretion that gatekeeping describes. Its contribution was to make the boundary reproducible - a peacetime idea, twenty-seven years later, in mathematics rather than engineering - which is what gave the ontology review grounds a single case could not."
  - heading: Why two occurrences are still not two replications
    body: "Naming the mechanism did not make it established, and the reason is now measured rather than argued. Both cases were produced by the same national cryptographic apparatus - one at a research station whose output went to the agency, one inside the agency itself - so the corpus records them as two cases in one independent context. Lifecycle status is decided by contexts, not by cases, which leaves compulsory secrecy emergent. What would establish it is an instance from a different regime, and the corpus does not have one."
  - heading: What this case rules out that the Flowers case could not
    body: "Credit misattribution was tested here far more seriously than in any other unmechanised case, because the reward for this idea demonstrably went to named other people who hold the field's highest award for it. It is still not tagged, and the distinction matters: Diffie, Hellman, Merkle, Rivest, Shamir and Adleman did not displace him, they arrived independently by another route without knowledge of his work. Displacement is what that mechanism requires. Independent rediscovery is a different event, and it cuts the other way - it is the reason his uniqueness score is the most bounded in the corpus."
