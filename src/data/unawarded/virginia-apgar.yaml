  verdicts:
  - mechanism: credit-misattribution
    verdict: not-supported
    note: The instrument carries her name in daily worldwide use; nothing is displaced.
  - mechanism: delayed-recognition
    verdict: not-supported
    note: The method was adopted within years and her honours ran from 1966 onward.
  - mechanism: institutional-exclusion
    verdict: not-supported
    note: 'Tested again against the two documented episodes - her move from surgery to anaesthesiology,
      which the archive records as encouraged by the chief of surgery, and the 1949 departmental chair
      going to a male colleague. The mechanism requires formal barriers to constrain the visibility from
      which honours derive, and her record shows the opposite: first woman full professor at her college,
      her specialty''s distinguished service award, her university''s gold medal and a national postage
      stamp.'
  - mechanism: institutional-gatekeeping
    verdict: not-supported
    note: No act obstructing publication or dissemination is documented; the 1953 proposal was published
      and adopted.
  - mechanism: posthumous-recognition
    verdict: not-supported
    note: No eligibility or timing rule is documented as determining anything. Honours arrived in her
      lifetime and continued after it, which is recognition proceeding normally rather than a rule foreclosing
      it.
  - mechanism: theory-experiment-asymmetry
    verdict: not-supported
    note: The mechanism this re-audit was opened for. A clinical scoring method has no prediction and
      no confirming experiment, and no theorist is documented as rewarded in her place. The fault line
      does not appear in the record.
  - mechanism: compulsory-secrecy
    verdict: not-supported
    note: No nondisclosure or classification obligation appears in the record; the method was published
      in 1953 and adopted worldwide.
  finding: no-mechanism-evidenced
  note: Re-audit against the full MOR-006 ontology, opened because the 2026-09-11 audit never tested theory-experiment
