mechanism_audit:
  search_date: '2026-09-11'
  ontology_revision: MOR-003
  revision_basis: >-
    Audit performed at commit 005118e (2026-09-11), when MOR-003 was the revision in force. The
    considered list was later pruned at commit 005a421 (MOR-004) to remove concepts that had ceased
    to be audit-eligible; that edit removed candidates, it did not test any new one, so the audit
    remains an MOR-003 audit.
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
  incomplete_at_revision:
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism is supported. Credit misattribution fails at once: the instrument carries her name in
    daily worldwide use. Institutional exclusion was tested against two documented episodes - her move
    from surgery to anaesthesiology, which the archive records as encouraged by the chief of surgery,
    and the 1949 departmental chair going to a male colleague - and not tagged. The mechanism requires
    that formal barriers constrain the visibility from which honours derive, and her honours record
    shows the opposite: first woman full professor at her college, her specialty's distinguished
    service award, her university's gold medal, a national postage stamp. Delayed recognition fails -
    the method was adopted within years. Gatekeeping and posthumous rules are unsupported. The measured
    gap is slightly negative, which is the outcome this case was accepted to test for.
  best_sources: [1, 2]
