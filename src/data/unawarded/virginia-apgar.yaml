  rationale:
    impact: The score gave obstetric teams a common, immediate measure of a newborn's condition and, in the archive's words, laid the foundations of neonatology.
    verification: The contribution is anchored to her own 1953 paper and documented in a national archive of her papers.
    uniqueness: The instrument is elegantly simple and was quickly adopted, but a standardised newborn assessment was a need the field was converging on, which bounds the counterfactual claim.
    durability: The method has been standard practice for seven decades.
    breadth: It is applied to children born in hospitals worldwide.
    attribution: The score carries her name in universal clinical use - attribution is as unambiguous as the corpus contains.
    observed_recognition: A globally spoken eponym, the first woman appointed full professor at her college, major awards from her specialty and her university, a commemorative US postage stamp in 1994 and induction into the National Women's Hall of Fame in 1995.
key_facts:
  - fact: "Apgar published \"A proposal for a new method of evaluation of the newborn infant\" in Current Researches in Anesthesia and Analgesia in 1953."
    source: 1
  - fact: "The National Library of Medicine records that her method \"has long been standard practice\", that it \"reduced infant mortality and laid the foundations of neonatology\", and that the evaluation \"is now performed on all children born in hospitals worldwide\"."
    source: 2
  - fact: In 1949 she was appointed a full professor of anaesthesiology at Columbia's College of Physicians and Surgeons, the first woman to hold that rank there; the chair of the new department went to a male colleague.
    source: 2
  - fact: Her honours included the Elizabeth Blackwell Award (1966), the Distinguished Service Award of the American Society of Anesthesiologists (1966), Columbia's Alumni Gold Medal for Distinguished Achievement (1973), a commemorative US postage stamp in 1994 and induction into the National Women's Hall of Fame in 1995.
    source: 2
analysis:
  - heading: The first case where recognition met assessed merit
    body: "This is the result the entry was opened to test. The assessment produces a high score on impact, durability, breadth and attribution, and a deliberately bounded score on counterfactual uniqueness, while the recognition record is one of the strongest in the corpus. The gap comes out slightly negative, inside the band the instrument labels as recognition roughly matching assessed merit. That is not a finding about Apgar; it is a finding about the instrument, which had never before been shown capable of producing it."
  - heading: A documented episode that is not a mechanism
    body: "The archive records that she expected the departmental chair in 1949 and that it went to a male colleague. The corpus records that too, and stops. Her recognition record does not show the displacement that the institutional-exclusion mechanism describes - she was made full professor, led her specialty's honours list and became a national figure - so no mechanism is tagged. Reading one career episode as the cause of a recognition gap that the measurement does not find would be exactly the inference this project refuses elsewhere."
