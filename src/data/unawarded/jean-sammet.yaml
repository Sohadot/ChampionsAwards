title: Jean Sammet
slug: jean-sammet
status: published
last_reviewed: 2026-09-12
domain: mathematics-computing
subfield: computing
summary: Jean Sammet chaired the subcommittee that wrote the statements of COBOL, originated and developed FORMAC at IBM, wrote the standard history of programming languages in 1969, led the ACM as its president, and collected honours across nine bodies between 1965 and 2013.
introduction: This entry tests the same proposition as the Zhang entry from the other side of the domain - what the instrument does with a contribution that is real, datable and substantially collective, rather than one that can be attributed to a single decisive step.
omission_case: "Her case matters because its uniqueness is bounded by the nature of the work rather than by any judgment this project imposes. COBOL was a committee product and she always described it as one; FORMAC is specifically hers; the 1969 book is hers alone. A corpus that only contains contributions attributable to one person cannot say anything about how recognition treats collective work, and this domain had no such case before."
structural_reason: "No structural reason is offered, and none is evidenced. The recognition record is one of the densest in this corpus and runs from 1965 to 2013 across an employer, a national academy, two professional societies, a museum and two women-in-computing bodies. No formal barrier to an appointment, a membership, an authorship or pay appears anywhere in the record read here, and the entry derives no mechanism from the shape of her career."
