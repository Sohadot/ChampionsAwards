audit_exceptions:
  - claim: contribution
    search_date: '2026-09-12'
    search_note: >-
      Sought her own published account of the work - the 1969 book and her conference history of
      COBOL - at a readable source. The awarding society's digital library returned HTTP 403 to this
      audit and the book's full text was not reachable. The contribution therefore rests on two
      institutional records that describe her role specifically, and on a museum catalogue record of
      the book, rather than on the primary texts.
    best_source: 1
    reason: >-
      Institution-record-sufficient. Both institutions state her committee role in the same specific
      terms, and neither the role nor the authorship of the book is contested anywhere in the record.
mechanism_audit:
  search_date: '2026-09-12'
  ontology_revision: MOR-004
  revision_basis: >-
    Audit performed at commit bd4083d, when MOR-004 was the revision in force.
  considered:
    - institutional-exclusion
    - credit-misattribution
    - delayed-recognition
    - institutional-gatekeeping
    - posthumous-recognition
    - theory-experiment-asymmetry
  finding: no-mechanism-evidenced
  note: >-
    No mechanism is evidenced, and the gap is negative, so the case is an aligned outcome rather than
    unexplained under-recognition. Institutional exclusion was the mechanism this case was most likely
    to attract and is not tagged: its definition requires a formal barrier to an appointment,
    membership, authorship or pay, and the record read here contains none, while documenting an
    unbroken recognition record from 1965 to 2013 across nine bodies. Credit misattribution was tested
    carefully, because a collective product is where displacement usually appears, and is not tagged:
    no source names another person as receiving her credit, and both institutions state her specific
    role inside the committee rather than attributing the language to an individual. Delayed
    recognition fails because the first honour arrived while the work was current. Gatekeeping,
    posthumous recognition and the theory-experiment asymmetry are unsupported.
  best_sources: [1, 2]
