  rationale:
    impact: "Three contributions of different kinds: the language that became the standard for business computing worldwide, one of the earliest formula-manipulation languages, and the book that established how the field records its own history. Scored below the corpus's infrastructural cases because each is substantial rather than foundational."
    verification: The contributions are documented by two institutions that honoured her and by a museum catalogue record of the book itself, and her specific committee role is stated rather than summarised.
    uniqueness: "Bounded by the nature of the work, and documented rather than assumed. She chaired the Short Range Subcommittee that developed all the statements of COBOL - a specific and attributable role inside a collective effort that no single person authored. FORMAC is credited to her as originator and developer, and the 1969 book is hers alone. The score reflects a portfolio in which the largest item is shared by construction."
    durability: COBOL remains in production use more than sixty years on, and the 1969 book is still the standard reference for the period it covers; FORMAC did not persist in the same way.
    breadth: Business computing reaches ordinary economic life rather than a research community only, which places the benefit wider than the corpus's discipline-internal cases.
    attribution: "Credit is clear and uncontested for FORMAC and for the book. For COBOL it is necessarily shared, and both institutional records describe her role as a committee role, which is how this entry states it."
    observed_recognition: "The densest anchored recognition record in this corpus: an employer's award in 1965, a college award in 1972, election to a national academy of engineering in 1977, an honorary doctorate in 1978, the presidency of her professional society from 1974 to 1976, that society's distinguished service award in 1985, a women-in-computing award in 1989, fellowship of the society in its initial group in 1994, a museum fellowship in 2001, a computer pioneer award in 2009 and a further pioneer award in 2013. Recognition across nine independent bodies, beginning during the work and continuing for five decades."
key_facts:
  - fact: "She was a member of the CODASYL COBOL committee and chairman of the Short Range Subcommittee, which developed all the statements of the language."
    source: 1
  - fact: She was the originator and developer of FORMAC, one of the earliest formula-manipulation languages, which she directed at IBM after joining the company in 1961.
    source: 1
  - fact: "Her 1969 book Programming Languages: History and Fundamentals has been described as the standard work on programming languages; the Computer History Museum's catalogue records it as a 785-page volume published by Prentice-Hall."
    source: 3
  - fact: "The Computer History Museum elected her a Fellow in 2001 for her contributions to the field of programming languages and its history, records that she served from 1959 to 1961 on the committee that developed COBOL, and that she was president of the ACM from 1974 to 1976 and a member of the National Academy of Engineering from 1977."
    source: 2
  - fact: "The professional society's pioneer record lists her honours by year: an employer award in 1965, a college centennial award in 1972, the National Academy of Engineering in 1977, an honorary doctorate in 1978, the society's distinguished service award in 1985, the Augusta Ada Lovelace Award in 1989, fellowship of the society in its initial group in 1994, a museum fellowship in 2001, the Computer Pioneer Award in 2009 and a further pioneer award in 2013."
    source: 1
analysis:
  - heading: A bounded uniqueness that the record states for us
    body: "The interesting thing about this case is that the corpus did not have to decide how much of COBOL to attribute to her. Both institutional records answer it: she chaired the subcommittee that wrote the language's statements, inside a committee that produced the language. That is more specific than membership and less than authorship, and it is exactly the kind of claim this project would otherwise have had to hedge. The uniqueness score sits where it does because the record put it there."
  - heading: The second half of the compression test
    body: "This entry and the Zhang entry were opened together to ask whether a lower assessed index brings lower recognition. Both return the same answer from opposite directions - a narrow single-author theorem in mathematics and a broad, partly collective portfolio in computing - and in both the gap is slightly negative. Two cases do not establish a relationship, but they do establish that the earlier two-point band was a property of which five people the corpus had chosen, not a property of the instrument."
  - heading: What this entry declines to read into the record
    body: "A woman who chaired a COBOL subcommittee in 1959 and led a professional society in 1974 invites an exclusion reading, and this corpus has two evidenced exclusion cases to pattern-match against. Nothing in the record read here supports one: no formal barrier to an appointment, a membership, an authorship or pay appears anywhere, and the recognition record begins in 1965 and never stops. The corpus does not infer a mechanism from a biography's shape, and it does not have standing to assign one to a career the record documents as continuously recognised."
