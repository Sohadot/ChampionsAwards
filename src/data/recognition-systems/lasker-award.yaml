title: Lasker Award
slug: lasker-award
status: published
last_reviewed: 2026-09-11
summary: The Albert Lasker Medical Research Awards were created in 1945 and are administered by the Albert and Mary Lasker Foundation, which selects recipients through an international jury following an annual nomination round.
introduction: The awards recognise contributions to medical research. They are widely described as a predictor of subsequent Nobel recognition; this entry records the selection machinery the foundation documents, and treats the predictive claim as a claim requiring evidence rather than as a property of the award.
power_structure: The awards derive their authority from a private foundation and the biomedical research community, which gives the programme independence from state and commercial sponsors while concentrating its funding in a single foundation.
selection_logic: "The foundation documents the mechanism: nominations are accepted annually from November to early February, and the medical research awards are selected by an international jury. What the selections concentrate on, by geography or institution, is not established by this entry - see the documented exception on representational breadth."
