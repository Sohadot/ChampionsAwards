  rationale:
    process: Selection follows an established juried procedure administered by the foundation.
    breadth: Recognition is biomedical and has historically been oriented toward the United States.
    track_record: A high proportion of recipients later receive the Nobel Prize, indicating durable selections.
    transparency: Criteria and recipients are public, though deliberations are private.
    independence: Foundation governance provides independence, with funding concentrated in a single foundation.
key_facts:
  - fact: The Lasker Awards are administered by the Albert and Mary Lasker Foundation.
    source: 1
  - fact: Many Lasker laureates have subsequently received the Nobel Prize.
