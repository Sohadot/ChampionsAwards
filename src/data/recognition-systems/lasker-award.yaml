analysis:
  - heading: A predictive signal, and what it concentrates
    body: "The Lasker Awards score highly on track record precisely because their selections so often anticipate the Nobel. That predictive strength, however, tends to concentrate on already well-resourced research environments, which the RLS reflects as a limit on representational breadth rather than a process failure."
