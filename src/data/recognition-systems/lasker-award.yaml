  rationale:
    process: The foundation documents an annual nomination window and selection by an international jury for the medical research awards.
    breadth: "The remit is biomedical only, which bounds the sub-field span. The distribution of recipients by geography or institution is not established here: the claim that selections concentrate on well-resourced research environments was carried by this entry until 2026-09-11 and is withdrawn as unevidenced. Score unchanged, on the narrower justification."
    track_record: "Recipients are published back to 1945, and the programme's selections are widely treated as durable. The specific claim that a high proportion later receive the Nobel Prize is not anchored to a record-grade count in this entry - see the documented exception."
    transparency: Criteria, the nomination window, the jury chair and the recipients are published; deliberations are not.
    independence: Governance rests with a private foundation rather than a state or commercial sponsor, with funding concentrated in that single foundation.
key_facts:
  - fact: The Lasker Awards programme was created in 1945 by Albert and Mary Lasker.
    source: 1
  - fact: The medical research awards are selected by an international jury, and the foundation accepts nominations annually from November to early February.
    source: 1
analysis:
  - heading: What this entry stopped claiming
    body: "Two claims were removed from this entry in the Cycle 02 baseline requalification. The first was that its selections tend to favour well-resourced research environments: no record-grade source was found for it, and tabulating recipients ourselves would be our own analysis rather than a documented fact. The second was the predictive-overlap figure used to justify the track-record score, which was asserted without a count anchored to a record. Both are now documented exceptions rather than assertions. What the foundation itself documents - the founding year, the annual nomination window, and selection by an international jury - is retained and anchored."
