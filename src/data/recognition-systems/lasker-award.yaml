title: Lasker Award
slug: lasker-award
status: published
last_reviewed: 2026-09-09
summary: The Albert Lasker Medical Research Awards are among the most respected honours in biomedical science and are noted for how often their recipients later receive the Nobel Prize.
introduction: Administered by the Lasker Foundation, the awards recognise major contributions to medical research, and their strong overlap with subsequent Nobel Prizes has made them a closely watched signal in the field.
power_structure: The awards derive authority from the biomedical research community and a private foundation, giving them substantial independence while tying their funding to that foundation.
selection_logic: Selection emphasises contributions with clear and durable impact on medicine, which strengthens the track record but concentrates recognition within well-resourced research centres.
