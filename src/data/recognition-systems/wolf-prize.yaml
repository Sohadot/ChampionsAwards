  rationale:
    process: "Requalified 2026-09-13 against what the Foundation actually publishes about the five things this dimension is made of - nomination, filtering, jury constitution, the decision, and any appeal. It publishes part of the first and none of the other four. Nomination is by invitation only, and the published route to being invited is to email the Foundation office with a name, title, affiliation and field; no classes of qualified nominator are defined anywhere, where every Nobel system in this corpus publishes between four and seven. Real constraints are published and are counted here: individuals only and never institutions, no self-nomination, nominations valid for three years, a dated submission deadline, and juries reappointed annually, which is a genuine structural guard against entrenchment. What is not published is everything that would let integrity be checked: no jury membership past or present, no jury size or appointment rule, no filtering stages, no decision rule, and no appeal or review route. A general description of a process is a statement about visibility, not evidence of robustness, and the previous score of 78 rested on one sentence that is the Foundation's entire published account of selection. Lowered from 78."
    breadth: "Half of this dimension is now measured and half is unassessable, and the score reflects both. Field coverage is real and documented: a project analysis over the Foundation's own laureate record - all 390 laureate pages, 1978 to 2025 - finds nine fields with the five sciences distributed evenly (Physics 72, Mathematics 68, Medicine 67, Chemistry 62, Agriculture 61) alongside 60 in the arts. That is unusually broad field coverage for a single prize and it supports the score. Representation across geographies and groups cannot be assessed at all from the published record, in any field: the Foundation publishes no eligibility rules and no nomination data, and the affiliation field is free text in which 58 of the 390 laureates carry no country component and many name only an institution. Lowered from 64 on 2026-09-13, because that score rested on field coverage alone while the dimension's definition also covers geographies and groups - it was silently averaging a half nobody had measured."
    track_record: "Requalified 2026-09-13 under the standard applied to the Nobel systems: longevity and archive completeness are not proxies for durability. The previous score of 76 rested on three things that measure neither - a complete laureate list, the field, year, affiliation and citation published for each, and continuous operation since 1978. Those establish that the record is well kept, not that the selections proved sound. No durability analysis exists in this corpus or was found for it, in any of the nine fields, and this entry's own shared-architecture note already said so. The earlier claim that the prize reliably anticipated later Nobel recognition was withdrawn on 2026-09-12 and is not revived. What survives is a fact about operation rather than about judgement: a project analysis over all 390 published laureate records confirms award activity in every calendar year from 1978 to 2025, with each science field awarded in 38 to 41 of those 48 years, so the prize runs continuously while any single field rotates out roughly one year in six. Lowered from 76 to the same conservative figure the Nobel science systems carry, because the evidence situation is identical - no analysis either way - and not because the records have been shown comparable."
    transparency: "The outcome layer is published in more detail than either other system in this corpus - for every laureate the year, the field, the affiliation held at the time, the full citation and whether the prize was shared. Nothing upstream of the decision is published: no nomination archive, no jury membership past or present, and no release horizon for either. Score unchanged; the wording now states which half is open."
    independence: "Requalified 2026-09-13, and the two halves of the dimension separate cleanly. Funding is genuinely independent and now documented rather than asserted: a single 1975 endowment from the Wolf family with no commercial or state sponsor of record, a named investment committee of five, a named internal auditor and a named accountant, and the Foundation's own record that trustees, council, committee members, juries and the auditor all serve on a voluntary basis. Decision-making independence cannot be verified at all: the Foundation appoints the juries that decide its prizes, publishes no jury membership past or present and no trustee list, so no separation between funder and decider is checkable from outside. The contrast is internal to the Foundation own publishing - it names who manages the money and not who picks the winners. Lowered from 76, which rested on a sentence asserting independence within a national context without distinguishing the funding from the decision."
key_facts:
- fact: The Wolf Prize has been awarded by the Wolf Foundation since 1978.
  source: 1
- fact: It is awarded across multiple fields, including sciences and the arts.
  source: 2
analysis:
- heading: A claim this entry stopped making
  body: "Until 2026-09-12 this entry described the prize as a frequent precursor to the Nobel Prize and scored its track record on that basis. The foundation makes no such claim, and establishing it would mean compiling its laureate list against another award's - this project's own analysis presented as a documented fact. The claim is withdrawn from the summary and from the score, which now rests on the published laureate record and the award's unbroken annual cycle. The award anatomy built in the same cycle flagged the claim; this entry is where it is resolved."
- heading: Breadth as a design choice
  body: The Wolf Prize trades some depth in any single field for coverage across many, which lifts its representational breadth relative to single-discipline awards. The RLS records this as a distinct legitimacy profile rather than ranking it against instruments built for one field only.
