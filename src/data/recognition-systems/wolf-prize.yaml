title: Wolf Prize
slug: wolf-prize
status: published
last_reviewed: 2026-09-12
summary: The Wolf Prize is an international award given by the Wolf Foundation since 1978 across five sciences and four arts, decided by juries reappointed annually for each field, and funded by a family endowment rather than by a commercial or state sponsor.
introduction: Awarded by the Wolf Foundation since 1978, the prize spans disciplines including physics, chemistry, medicine, mathematics, agriculture, and the arts, giving it unusually wide subject coverage for a single system.
power_structure: The prize derives authority from an established foundation and international juries, providing independence while operating within a national institutional context.
selection_logic: Selection recognises sustained achievement across multiple fields, broadening coverage relative to single-discipline awards while spreading attention across many domains.
