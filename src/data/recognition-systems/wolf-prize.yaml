audit_exceptions:
- claim: representational-breadth
  search_date: '2026-09-13'
  search_note: >-
    Attempted a project analysis of laureate geography across the three scored domains, to test
    whether the breadth dimension is portable between them. All 390 laureate pages were fetched and
    parsed. The attempt failed on the archive, not on effort: the Foundation publishes affiliation
    as free text, 58 of the 390 entries carry no country component at all, many name only an
    institution, and the field label itself is inconsistent enough to contain a spelling variant.
    No eligibility rules and no nomination data are published for any field, so the eligible-pool
    half cannot be examined either.
  best_source: 4
  reason: >-
    Known-status. The field-coverage half of the dimension is measured and supports the score; the
    representation half is unassessable from the published record, uniformly across fields. The
    score was lowered from 64 rather than the gap being averaged into silence.
- claim: process-detail
  search_date: '2026-09-13'
  search_note: >-
    The process score of 78 predates this round and rests on a single published sentence -
    international judging committees, reappointed annually, comprising experts in their fields. The
    portability check confirmed that is the Foundation's entire published account of selection: no
    jury membership, no nomination eligibility, no selection stages, no decision rule, for any of
    the nine fields, verified across 390 laureate pages.
  best_source: 1
  reason: >-
    Open finding, deliberately not acted on in this round, which was scoped to the gate correction
    and the portability check. Flagged for requalification: a score of 78 sits above systems whose
    full stage calendar and decision rule are published, and this round did not establish that it
    should.
- claim: track-record
  search_date: '2026-09-12'
  search_note: >-
    Searched the foundation's own pages for any statement that the prize anticipates or predicts later
    Nobel recognition. The foundation makes no such claim on its prize page, its about page or its
    nomination page. Establishing it independently would require compiling the Wolf laureate list
    against the Nobel laureate list, which is this project's own analysis rather than a documented fact.
  best_source: 1
  reason: >-
    Withdrawn. The score now rests on the published laureate record - complete since 1978, with field,
    year, affiliation at the time and citation for each laureate - and on the award's unbroken annual
    cycle, and was lowered accordingly.
