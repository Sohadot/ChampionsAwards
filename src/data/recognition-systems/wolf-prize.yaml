  rationale:
    process: International juries select recipients under established criteria.
    breadth: Coverage spans multiple sciences and the arts, broadening representation across fields.
    track_record: "The foundation publishes its laureates in full since 1978, with each laureate's field, year, affiliation at the time and citation, and the prize has run annually without interruption. The claim that in several fields the prize has reliably anticipated later Nobel recognition was carried by this entry until 2026-09-12 and is withdrawn as unevidenced - see the documented exception. Lowered from 82, since the score rested on it."
    transparency: "The outcome layer is published in more detail than either other system in this corpus - for every laureate the year, the field, the affiliation held at the time, the full citation and whether the prize was shared. Nothing upstream of the decision is published: no nomination archive, no jury membership past or present, and no release horizon for either. Score unchanged; the wording now states which half is open."
    independence: Foundation and jury governance provide independence within a national context.
key_facts:
- fact: The Wolf Prize has been awarded by the Wolf Foundation since 1978.
  source: 1
- fact: It is awarded across multiple fields, including sciences and the arts.
  source: 2
analysis:
- heading: A claim this entry stopped making
  body: "Until 2026-09-12 this entry described the prize as a frequent precursor to the Nobel Prize and scored its track record on that basis. The foundation makes no such claim, and establishing it would mean compiling its laureate list against another award's - this project's own analysis presented as a documented fact. The claim is withdrawn from the summary and from the score, which now rests on the published laureate record and the award's unbroken annual cycle. The award anatomy built in the same cycle flagged the claim; this entry is where it is resolved."
- heading: Breadth as a design choice
  body: The Wolf Prize trades some depth in any single field for coverage across many, which lifts its representational breadth relative to single-discipline awards. The RLS records this as a distinct legitimacy profile rather than ranking it against instruments built for one field only.
