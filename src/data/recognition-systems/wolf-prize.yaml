analysis:
  - heading: Breadth as a design choice
    body: "The Wolf Prize trades some depth in any single field for coverage across many, which lifts its representational breadth relative to single-discipline awards. The RLS records this as a distinct legitimacy profile rather than ranking it against instruments built for one field only."
