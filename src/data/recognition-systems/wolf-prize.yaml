assessment_scope:
  covers:
  - physics-astronomy
  - biology-medicine
  - mathematics-computing
  note: >-
    One Foundation, one endowment, one published selection architecture - but a separate judging
    committee per field, which is why this scope is justified dimension by dimension below rather
    than asserted from the common name. The portability check was run on 2026-09-13 before any
    score was touched; it changed one dimension and left the scope intact.
  shared_architecture:
    process: >-
      Shared, in the strong and slightly uncomfortable sense that there is only one published
      account of selection and it is field-agnostic: international judging committees, reappointed
      annually, comprising experts in their fields. The Foundation publishes no per-field rules, no
      nomination eligibility and no selection stages, so nothing distinguishes one field's process
      from another's in the record - and nothing describes any of them in detail either. The
      sharing is documented; see the open finding on what that implies for the score itself.
    breadth: >-
      Shared on the half that can be assessed and unassessable on the other half, uniformly across
      fields. The eligibility architecture is field-agnostic and carries no published geographic
      restriction anywhere, and the field-coverage record is measured across all nine fields. The
      representation half cannot be compared between fields because the affiliation record is free
      text without a consistent country component - a limitation of the archive that applies
      identically to physics, medicine and mathematics, not one that distinguishes them. The score
      was lowered rather than the gap assumed away.
    track_record: >-
      Shared. The full laureate record is published for every field - year, field, affiliation,
      citation and sharing - and no durability analysis exists for any of them. The score is
      conservative for the same reason in all three domains, which is a shared evidence situation
      rather than a shared finding about the records.
    transparency: >-
      Shared, and verified rather than assumed. All 390 laureate pages were examined: every one
      publishes field and year, 389 publish a citation, 332 an affiliation, and not one page in any
      field discloses jury membership or nomination records. The pattern - a fully published
      outcome layer and nothing at all upstream of the decision - holds uniformly across the nine
      fields, so it is a property of the Foundation's publication practice and not of a field.
    independence: >-
      Shared. A single 1975 family endowment funds every field, one Board of Trustees governs them,
      and the Foundation records that trustees, council, committee members, juries and the internal
      auditor all serve on a voluntary basis. No field has a separate funder or a separate
      governance route.
  excludes:
  - domain: literature
    reason: >-
      The Wolf Prize awards in music, architecture, painting and sculpture, but not in literature.
      Nothing in this assessment reaches a literary recognition system.
# Corrected 2026-09-12, on the evidence of the award anatomy built this cycle.
# This entry recorded the prize as cross-cutting inside Mathematics & Computing,
# on the reasoning that a multi-field award spans the join. The foundation's own
# list of fields is Agriculture, Chemistry, Mathematics, Medicine and Physics in
# the sciences and Architecture, Music, Painting and Sculpture in the arts - there
# is no computing field, so no Wolf jury could compare a mathematician with a
# computer scientist. Within this domain the prize operates in mathematics only.
# What is genuinely cross-cutting about it is that it crosses DOMAINS, which the
# `domains` list above already records.
subfield: mathematics
