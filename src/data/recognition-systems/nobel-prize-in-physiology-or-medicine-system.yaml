    Searched for a stated reason why the Physiology or Medicine nomination archive reaches only 1953
    when the fifty-year rule would by now release two further decades. The archive notes the coverage
    and attributes delays generally to internal work processes, without a category-specific reason.
  best_source: 4
  reason: >-
    The gap is scored as a fact about delivery; no cause is attributed to it, and no inference about
    intent is drawn from it.
- claim: durability-of-selections
  search_date: '2026-09-13'
  search_note: >-
    Searched for any systematic analysis of whether this system's selections have endured. None was
