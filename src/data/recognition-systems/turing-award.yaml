title: Turing Award
slug: turing-award
status: published
last_reviewed: 2026-09-11
summary: The ACM A.M. Turing Award, first presented in 1966, recognises contributions of a technical nature made to the computing community, and carries a prize of one million dollars whose financial support is provided by a single commercial sponsor.
introduction: This entry records what the awarding body documents about the award's criteria, its history and its funding, and treats claims about where recipients come from, how they are regarded, or how the award compares to other prizes as claims requiring attribution rather than as properties of the award.
power_structure: "Authority rests with a professional society, the Association for Computing Machinery, rather than a state body. The funding does not: the prize amount is provided by a commercial sponsor, Google, and rose to one million dollars in 2014 from the quarter of a million in force from 2007."
selection_logic: Selection recognises contributions of a technical nature whose importance to computing is lasting and major, which in practice means the award follows demonstrated durability rather than early promise.
