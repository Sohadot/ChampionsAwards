  process: 82
  breadth: 58
  track_record: 76
  transparency: 62
  independence: 62
  evidence:
    process: [1]
    breadth: [1, 2]
    track_record: [2]
    transparency: [1]
    independence: [1]
  rationale:
    process: "Selection is run by the awarding society under published criteria - contributions of a technical nature of lasting and major importance to computing - and the award has been made annually since 1966."
    breadth: "The remit is computing only, which bounds the sub-field span. The claim that the award has historically skewed toward a small set of institutions and regions was carried by this entry until 2026-09-11 and is withdrawn as unevidenced - see the documented exception. Score unchanged, on the narrower justification."
    track_record: "The recipient record is published in full back to 1966. The claim that recipients are broadly regarded as foundational figures was withdrawn on 2026-09-11 as an evaluative generalisation with no record-grade source. Lowered from 85, since the score rested on it."
    transparency: Criteria and recipients are published; deliberations are not.
    independence: "Governance rests with a professional society rather than a state or a firm, but the prize amount is funded by a single commercial sponsor of record. Lowered from 85 on 2026-09-11: the earlier score asserted freedom from commercial capture while the award's own documentation names a commercial funder, which the entry had not recorded."
key_facts:
  - fact: "The award recognises contributions of a technical nature made to the computing community, of lasting and major technical importance to the field."
    source: 1
  - fact: It was first presented in 1966, to Alan J. Perlis, and is named after Alan Turing.
    source: 2
  - fact: The prize was accompanied by 250,000 US dollars from 2007, and the funding level was increased to one million US dollars effective 2014.
    source: 3
  - fact: Financial support for the prize is provided by Google.
    source: 1
analysis:
  - heading: An independence score that had not read its own funding
    body: "This entry previously scored independence at the level it gave the Nobel system, on the reasoning that professional-society governance keeps the award largely free of commercial capture. The award's own documentation names a single commercial sponsor as the source of its one-million-dollar prize. Governance and funding are different things, and the requalification separates them: the awarding body remains a scholarly society, and the money does not come from one. The score is lowered to reflect what the record says rather than what the governance structure suggests."
  - heading: Three claims this entry stopped making
    body: "Withdrawn in the Cycle 03 requalification: that the award has historically skewed toward a small set of institutions and regions, for which no source was found; that recipients are broadly regarded as foundational figures, which is an evaluative generalisation; and the description of the award as computing's equivalent of a Nobel Prize. The last is a widely used nickname rather than a property of the award, and the awarding body's own page could not be read directly in this audit, so it is not asserted here in reference language."
