audit_exceptions:
  - claim: representational-breadth
    search_date: '2026-09-11'
    search_note: "Searched for a record-grade source on the institutional or geographic distribution of recipients. None was found. The recipient list is published, but compiling it into a distribution would be this project's own analysis presented as a documented fact."
    best_source: 2
    reason: "Known-status: the documented bound on breadth is the remit - computing only. The skew claim is withdrawn."
  - claim: track-record
    search_date: '2026-09-11'
    search_note: "Searched for a record-grade basis for the claim that recipients are broadly regarded as foundational figures in computing. None was found."
    best_source: 2
    reason: Withdrawn. The score now rests on the published recipient record and the award's unbroken annual cycle, and was lowered accordingly.
  - claim: nobel-comparison
    search_date: '2026-09-11'
    search_note: "The description of the award as the Nobel Prize of computing is widely used and is reported to appear in the awarding body's own materials, but those pages returned HTTP 403 to this audit and could not be read directly. A foundation page co-organised with the awarding society uses the phrase while attributing it to general recognition rather than to the society."
    best_source: 3
    reason: Not asserted. A nickname that cannot be attributed to a source this audit read has no place in reference language, so it was removed from the summary rather than repeated.

