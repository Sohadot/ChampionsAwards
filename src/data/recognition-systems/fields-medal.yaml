    process: Selection is run by International Mathematical Union committees under established criteria.
    breadth: The under-40 rule and concentration in a small number of elite institutions narrow representational breadth.
    track_record: Recipients have overwhelmingly gone on to sustained mathematical leadership.
    transparency: The criteria and recipients are public, though committee deliberations are private.
    independence: Academic governance keeps it largely free of commercial or political capture.
key_facts:
  - fact: The Fields Medal is awarded by the International Mathematical Union, typically every four years at the International Congress of Mathematicians.
    source: 1
  - fact: Recipients must normally be under 40 years of age in the year of the award.
    source: 1
  - fact: The medal was first awarded in 1936.
    source: 2
analysis:
  - heading: What the age rule reveals
    body: The under-40 restriction is the medal's defining design choice. It sharpens the prize into a signal about emerging talent, but it also means the system cannot, by construction, recognise work whose significance is only established later in a career - a legitimacy trade-off the RLS captures as reduced representational breadth rather than as a flaw in process.
