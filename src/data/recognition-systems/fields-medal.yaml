rule_history:
  - element: eligibility
    current_rule: "A candidate's fortieth birthday must not occur before 1 January of the year of the Congress at which the Fields Medals are awarded."
    effective_from: 1966
    predecessor_state: >-
      Known in outline. Before 1966 the criterion was not a fixed age but a judgment about candidates
      whose careers might benefit from encouragement; a historian of mathematics records that the
      fortieth-birthday limit was codified in 1966. The text of the earlier criterion was not reached
      by this audit.
    exception:
      search_date: '2026-09-11'
      search_note: "Searched the IMU's published pages for a dated history of the eligibility rule. The current rule is published; no IMU document giving its adoption date or its predecessor text was reached."
      reason: The adoption date rests on a scholarly account rather than on the union's own record, and is stated as such. No corpus case is currently tied to this rule.
