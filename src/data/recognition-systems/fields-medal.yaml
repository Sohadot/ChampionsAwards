title: Fields Medal
slug: fields-medal
status: published
last_reviewed: 2026-09-11
summary: The Fields Medal is awarded every four years by the International Mathematical Union at the International Congress of Mathematicians, and its age rule - a candidate's fortieth birthday must not occur before 1 January of the Congress year - makes it a documented case of an eligibility rule shaping what a recognition system can see.
introduction: The medal was first awarded in 1936. This entry records the selection machinery the International Mathematical Union publishes, and treats claims about where its recipients come from, or what they went on to do, as claims requiring evidence rather than as properties of the award.
power_structure: "The IMU documents the funding: the medals and cash prizes come from a trust established by J. C. Fields at the University of Toronto, supplemented periodically. There is no commercial or state sponsor of record."
selection_logic: "The Fields Medal Committee is chosen by the IMU Executive Committee and normally chaired by the IMU President; it is asked to choose at least two medalists, with a strong preference for four, and to have regard to representing a diversity of mathematical fields. The age rule means the system cannot, by construction, recognise work whose significance is established later in a career."
