  rationale:
    process: "The IMU publishes the committee's composition rule, its size guidance, and the eligibility rule, and the medal has been awarded on a fixed four-year cycle since 1936."
    breadth: "Two documented features pull in opposite directions: the committee is asked to have regard to representing a diversity of mathematical fields, while the age rule excludes work recognised later in a career. The claim that recipients concentrate in a small number of elite institutions was carried by this entry until 2026-09-11 and is withdrawn as unevidenced - see the documented exception. Score unchanged, on the narrower justification."
    track_record: "The laureate record is published in full back to 1936. The claim that recipients overwhelmingly went on to sustained mathematical leadership was withdrawn on 2026-09-11: it is an evaluative generalisation about careers, and no record-grade source was found for it. Lowered from 82, since the score previously rested on that claim."
    transparency: "The criteria, the laureates and the prize committees are published, including which members recused themselves; deliberations are not published."
    independence: Funding comes from a trust at a university rather than from a commercial or state sponsor, and the awarding body is an international scholarly union.
key_facts:
  - fact: "The Fields Medal is awarded every four years at the International Congress of Mathematicians to recognise outstanding mathematical achievement for existing work and for the promise of future achievement."
    source: 1
  - fact: "The IMU states the age rule as: a candidate's fortieth birthday must not occur before 1 January of the year of the Congress at which the medals are awarded."
    source: 1
  - fact: The Fields Medal Committee is chosen by the IMU Executive Committee, is normally chaired by the IMU President, and is asked to choose at least two medalists, with a strong preference for four, having regard to representing a diversity of mathematical fields.
    source: 1
  - fact: The medals and cash prizes are funded by a trust established by J. C. Fields at the University of Toronto, supplemented periodically.
    source: 1
  - fact: The medal was first awarded in 1936, and the IMU publishes the full list of laureates and of past prize committees.
    source: 1
  - fact: A historian of mathematics records that the age limit was codified in 1966, replacing an earlier and vaguer criterion about candidates whose careers might benefit from encouragement.
    source: 3
analysis:
  - heading: What the age rule reveals, and when it began
    body: "The age rule is the medal's defining design choice: it sharpens the prize into a signal about early work, and means the system cannot, by construction, recognise significance established later in a career. Its current form is published by the IMU. Its history matters as much - the limit was codified in 1966, replacing a vaguer criterion about candidates whose careers might benefit from encouragement - so any future corpus case touching this rule must be dated against the version then in force rather than against today's."
  - heading: Two claims this entry stopped making
    body: "Until the Cycle 03 requalification this entry stated that recipients concentrate in a small number of elite institutions, and that they have overwhelmingly gone on to sustained mathematical leadership. Neither had a source. Tabulating laureates' affiliations or careers ourselves would be our own analysis presented as a documented fact, so both are now documented exceptions, and the track-record score is lowered to what the published laureate record alone supports."
