title: Fields Medal
slug: fields-medal
status: published
last_reviewed: 2026-09-08
summary: The Fields Medal is one of the most prestigious honours in mathematics, awarded by the International Mathematical Union, and its age restriction makes it a revealing case study in how eligibility rules shape a recognition system.
introduction: Established through the will of Canadian mathematician John Charles Fields and first awarded in 1936, the medal recognises outstanding mathematical achievement while deliberately privileging early-career work.
power_structure: The medal derives its authority from the International Mathematical Union and the mathematical community's consensus, rather than from commercial or state sponsorship, giving it strong independence.
selection_logic: Because eligibility is capped at mathematicians under 40 in the year of the International Congress, the system structurally excludes late-blooming or late-recognised work, trading breadth for a focus on emerging talent.
