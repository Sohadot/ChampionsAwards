audit_exceptions:
- claim: criteria-history
  search_date: '2026-09-13'
  search_note: >-
    Searched for a record-grade basis - an awarding-institution record or a contemporaneous document -
    for the claim that the prize's selection criterion has shifted across successive eras. None was
    found, and the statutes are silent on it by design: §10 seals the annual committee reports in
    which the criteria were actually applied, and forbids recording dissent at all. The best source
    reached is the Academy's own published history of the prize, written by a member who chaired its
    Nobel Committee - authoritative, but an interpretive history rather than a record of a decision.
  best_source: 11
  reason: >-
    Known-status, not withdrawn. The claim stands on a scholarly-secondary source and is scored as
    such: it is one of the two supports under a conservative track-record figure, and the figure is
    conservative partly because its evidence cannot be closed at record grade.
- claim: durability-of-selections
  search_date: '2026-09-13'
  search_note: >-
    Searched for any systematic analysis of whether this system's selections have endured. None was
    found and none exists in this corpus. The published laureate list is not such an analysis, and
    treating it as one would be inferring a track record from the prize's standing.
  best_source: 9
  reason: >-
    Not claimed in either direction. The track-record score reflects documented criterion instability
    and the absence of a durability analysis, and is recorded as the dimension most likely to move
    when evidence arrives.
- claim: membership-tenure
  search_date: '2026-09-13'
  search_note: >-
    Searched the Swedish Academy's own pages for whether its eighteen members hold their chairs for
    life. Self-election by secret ballot and the King's approval are documented; tenure is not stated
    on the English pages, and the Swedish statutes page returned no readable text to this audit.
  best_source: 6
  reason: >-
    Left unestablished rather than assumed. No dimension is scored on it, and the independence
    rationale rests on self-election, which is documented.
