summary: The Breakthrough Prize in Fundamental Physics is a privately funded award established in 2012, distinctive for its open public nomination, a selection committee of previous laureates, and a discretionary Special Prize that can be given at any time.
introduction: The prize offers a different legitimacy profile from older scientific honours - large, privately endowed, and procedurally unusual - which makes it a useful comparison case rather than another instance of the traditional model.
power_structure: Authority rests on private philanthropic funding and on a committee of prior laureates, which grants independence from state or professional-society control but concentrates influence among past winners and founders.
selection_logic: Winners are chosen by a committee of previous laureates from candidates nominated through an open online process, and a Special Prize may be awarded outside the ordinary annual cycle and is not limited to recent discoveries.
