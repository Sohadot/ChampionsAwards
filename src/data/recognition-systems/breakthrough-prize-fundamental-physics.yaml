  rationale:
    process: An open nomination process and a laureate committee are established, but a discretionary Special Prize can bypass the ordinary cycle, which tempers procedural consistency.
    breadth: The prize is confined to fundamental physics, though open nomination widens who may be put forward.
    track_record: Recipients are eminent, but the prize is young (since 2012), so its long-term selection record is still short.
    transparency: Criteria, the named laureate committee, and an open nomination route are public, while deliberations are not.
    independence: Private philanthropic funding frees it from state or society control but concentrates influence among founders and past winners.
key_facts:
  - fact: The Breakthrough Prize in Fundamental Physics was established in 2012 and is chosen by a committee of previous laureates from openly nominated candidates.
    source: 1
  - fact: A Special Breakthrough Prize can be awarded at any time, outside the annual cycle, and is not limited to recent discoveries.
    source: 1
analysis:
  - heading: A different shape of legitimacy
    body: "The Breakthrough Prize scores lower than the traditional honours already in the archive, not because it is weaker but because its structure is different: private funding, an open nomination funnel, a laureate-only committee, and a discretionary Special Prize. The RLS registers this as moderate rather than strong legitimacy, which is exactly the comparison value a new-model prize adds."
