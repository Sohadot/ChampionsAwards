title: Theory-Experiment Asymmetry
slug: theory-experiment-asymmetry
status: published
last_reviewed: 2026-09-09
summary: Theory-experiment asymmetry describes cases where recognition rewards a theoretical prediction more than the experimental work that confirmed it, even when the confirmation was decisive in making the theory accepted.
definition: Theory-experiment asymmetry is a pattern in which the visible reward for a discovery flows to the predicting theorists rather than to the experimentalists whose results converted the prediction into established science.
explanation: A prediction becomes accepted science only when experiment confirms it, yet prize architectures have often honoured the theoretical statement over the experimental proof. The pattern is distinct from general credit misattribution because it tracks a specific fault line, the division between predicting and demonstrating.
implications: Where theory-experiment asymmetry operates, the recognition record understates the role of experiment, and a domain's history of discovery can appear more theory-driven than it was.
