title: Institutional Exclusion
slug: institutional-exclusion
status: published
last_reviewed: 2026-09-09
summary: Institutional exclusion describes cases where recognition is withheld or suppressed because a contributor was barred from the positions, memberships, or standing through which recognition normally flows.
definition: Institutional exclusion is a pattern in which formal barriers - to appointments, authorship, membership, or pay - constrain the visibility from which honours are usually derived, independent of the quality of the work.
explanation: The mechanism operates before recognition can even accrue, because someone kept out of a professorship, a society, or a byline generates a thinner formal record. The history of science documents a gendered form, the Matilda effect, describing the systematic under-recognition of women scientists.
implications: Institutional exclusion means the recognition record partly measures who was allowed to participate, so a credible evaluation must ask what barriers shaped the record it reads.
key_facts:
  - fact: The "Matilda effect," named by historian Margaret W. Rossiter in 1993, describes the systematic under-recognition of women scientists.
