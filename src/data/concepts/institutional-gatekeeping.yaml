title: Institutional Gatekeeping
slug: institutional-gatekeeping
status: published
last_reviewed: 2026-09-09
summary: Institutional gatekeeping describes cases where those controlling publication, seminars, or access actively delay or block a contribution from entering the record, independent of its merit.
definition: Institutional gatekeeping is a pattern in which a person holding editorial, institutional, or reviewing authority prevents or slows the dissemination of work, shaping which contributions become visible and when.
explanation: The mechanism is active obstruction rather than passive neglect. A gatekeeper can withhold a paper from journal submission, cancel a seminar, or steer where and whether work appears, so that priority and credit are decided by control of channels rather than by the contribution itself.
implications: Where gatekeeping operates, the recognition record reflects who controlled access as much as who did the work, and the true timeline of a discovery can be obscured for years.
sources:
