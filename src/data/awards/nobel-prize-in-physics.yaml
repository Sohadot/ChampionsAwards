key_facts:
  - fact: The Nobel Prize in Physics was first awarded in 1901.
    source: 4
  - fact: In several years no Physics prize was awarded, the decision being reserved or the prize withheld.
    source: 4
corpus_relations:
  - case: chien-shiung-wu
    architecture_element: decision_stages
    interaction_type: documented-award-outcome
    record_anchor: [5]
    claim: The 1957 Physics Prize was awarded to Tsung-Dao Lee and Chen Ning Yang; Wu, who led the confirming experiment, was not among the laureates.
  - case: jocelyn-bell-burnell
    architecture_element: decision_stages
    interaction_type: documented-award-outcome
    record_anchor: [7]
    claim: The 1974 Physics Prize was awarded to Martin Ryle and Antony Hewish; the graduate student who first identified the pulsar signal was not among the laureates.
  - case: george-zweig
    architecture_element: decision_stages
    interaction_type: documented-award-outcome
    record_anchor: [6]
    claim: The 1969 Physics Prize was awarded to Murray Gell-Mann for the classification of elementary particles; Zweig, who independently proposed the quark model, was not among the laureates.
  - case: ralph-alpher
    architecture_element: decision_stages
    interaction_type: documented-award-outcome
    record_anchor: [8]
    claim: The cosmic-microwave-background half of the 1978 Physics Prize was awarded to Penzias and Wilson for the detection; the 1948 prediction by Alpher and Herman was not among the recognised work.
  - case: vera-rubin
    architecture_element: posthumous_rule
    interaction_type: posthumous-constraint
    record_anchor: [2]
    claim: Under the no-posthumous rule in the Statutes, a Physics Prize cannot be awarded to Rubin after her death in 2016; she received none in her lifetime.
    rule_at_time:
      event_date: 2016
      effective_from: 1974
      rule_in_force: >-
        The prohibition on posthumous awards entered the Statutes of the Nobel Foundation in 1974 (a
        prize cannot be awarded posthumously unless death occurred after the announcement), so it was
        in force at the time of this event.
      record_anchor: [2, 4]
  - case: satyendra-nath-bose
    architecture_element: eligibility
    interaction_type: historical-non-award
    exception:
      search_date: '2026-09-10'
      search_note: >-
        Searched the Nobel Prize records for any Physics award to Bose. Correction to the earlier note on
        this relation, which stated that nomination records are sealed for fifty years and that no
        positive record could be cited: the fifty-year rule had already lapsed for these nominations, and
        the nomination archive does publish them. That correction is recorded in the separate
        documented-nomination relation below.
      reason: The absence of an award is a negative fact; no institutional record states a non-award, so the laureate record is cited instead.
      best_source: 4
    claim: The record shows no Nobel Prize in Physics awarded to Bose.
  - case: satyendra-nath-bose
    architecture_element: nomination
    interaction_type: documented-nomination
    record_anchor: [9]
    claim: The Nobel nomination archive records Bose as a nominee in eleven nominations for the Physics Prize between 1956 and 1972.
  - case: satyendra-nath-bose
    architecture_element: selection_body
    interaction_type: archival-selection-record
    exception:
      search_date: '2026-09-10'
      search_note: >-
        Searched nobelprize.org and the Nobel archive interfaces for the committee's own evaluation
        documents for the 1956 Physics nominations. The nomination archive publishes nominators and
        nominees, not the committee's expert reports; the evaluation itself was not reachable.
      reason: The evaluation is reported by a historian of science working from the Nobel archives, and is cited as that scholarly account rather than as the archival document, which was not inspected directly.
      best_source: 10
    claim: A historian working from the Nobel archives reports that the committee commissioned an expert evaluation of Bose's work from Oskar Klein in 1956.
