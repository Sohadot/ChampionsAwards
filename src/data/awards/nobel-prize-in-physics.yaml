title: Nobel Prize in Physics
slug: nobel-prize-in-physics
status: published
last_reviewed: 2026-09-09
domain: physics-astronomy
summary: The Nobel Prize in Physics is a closed-nomination, committee-screened award decided by the Royal Swedish Academy of Sciences, with a three-laureate limit, a fifty-year secrecy rule, no posthumous awards, and no appeal - an anatomy of a recognition mechanism rather than a hall of fame.
introduction: This entry reads the Physics prize as a mechanism. It separates what the rules formally say (architecture), what the historical record shows (operation), and where ChampionsAwards cases touch that structure (our analysis) - keeping the three strictly apart.
architecture:
  granting_body: The Royal Swedish Academy of Sciences awards the Nobel Prize in Physics, within the framework of the Nobel Foundation.
  governing_documents:
    - Alfred Nobel's will (1895)
    - Statutes of the Nobel Foundation
  eligibility: Awarded for a discovery or invention in the field of physics; a candidate must be nominated, and self-nomination is not accepted.
  nomination: Only invited, qualified nominators may propose candidates - members of the Academy, tenured physics professors in the Nordic countries, holders of chairs the Academy selects, prior laureates, and others the Academy chooses to invite. Nomination is not open to the public.
  selection_body: The Nobel Committee for Physics screens the nominations, commissions expert assessments, and recommends laureates to the Academy.
  decision_stages:
    - Invited nominations submitted
    - Committee screening and expert evaluation
    - Committee recommendation
    - Final decision by the Royal Swedish Academy of Sciences
  sharing_rule: A prize may be divided among at most three laureates and among no more than two different works.
  posthumous_rule: A prize is not awarded posthumously, unless the laureate died after the award decision was announced.
  secrecy: Information on nominations - nominees, nominators, investigations and opinions - is sealed for fifty years.
  withholding: If none of the works under consideration meets the criteria, the prize money may be reserved to the following year or withheld.
  finality: A decision of the prize-awarding body on the award of a prize may not be appealed.
