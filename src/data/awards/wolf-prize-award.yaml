archive_visibility:
  secrecy_rule: >-
    The foundation publishes no nomination archive and no list of jury members, past or present, and
    states no release horizon for either. Nomination is by invitation and a nomination remains valid
    for three years, so a candidacy may be live across several decisions without ever being visible.
  as_of: '2026-09-12'
  record_anchor: [1, 3]
  note: >-
    The open half of this record is the outcome layer, and it is open in more detail than either other
    anatomy in this domain: for each laureate the foundation gives the year, the field, the affiliation
    held at the time of the award, the full citation and whether the prize was shared. The closed half
    is everything upstream of the decision.
  case_status:
    - case: andrew-wiles
      years: 1995-1996
      status: deliberation-not-reached
      note: The laureate record, the citation and the prize share are published; no jury membership, nomination or deliberation record for this award was reached, and none appears to be published. No jury rationale beyond the published citation is asserted here.
      record_anchor: [4]
    - case: chien-shiung-wu
      years: '1978'
      status: deliberation-not-reached
      note: As above for the inaugural physics prize. The citation is published in full and is the only statement of reasons this audit can attribute to the foundation.
      record_anchor: [5]
