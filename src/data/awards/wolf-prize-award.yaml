audit_exceptions:
  - claim: architecture:governing_documents
    search_date: '2026-09-12'
    search_note: >-
      Searched the foundation's site for statutes, regulations or by-laws governing the prize. None is
      published. The rules recorded above are those the foundation states on its prize, about and
      nomination pages, which is a weaker instrument than a published statute and is described as such
      rather than presented as one.
    best_source: 3
    reason: >-
      No governing document exists in the open record to cite. The architecture is assembled from the
      awarding body's own descriptive pages, and the entry says so.
  - claim: architecture:procedure
    search_date: '2026-09-12'
    search_note: >-
      Sought the decision calendar beyond the submission deadline, any rule on posthumous candidates,
      any rule on withholding a prize when no candidate is found suitable, any appeal provision, and
      any maximum number of laureates per field. None of these is published.
    best_source: 3
    reason: >-
      Not reached, and not summarised. Five architecture elements are omitted rather than inferred from
      the other anatomies in this corpus, whose rules have no authority over this award.
  - claim: nobel-precursor
    search_date: '2026-09-12'
    search_note: >-
      Sought a record-grade basis for the claim, carried by this project's recognition-system entry for
      the prize, that it reliably anticipates later Nobel recognition. The foundation does not state it.
      Establishing it would require compiling its laureate list against another award's, which would be
      this project's own analysis presented as a documented fact.
    best_source: 1
    reason: >-
      Not asserted on this page, and now resolved at source: the recognition-system entry withdrew the
      claim on 2026-09-12 and lowered its track-record score from 82 to 76 accordingly.
