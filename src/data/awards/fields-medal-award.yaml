audit_exceptions:
  - claim: architecture:procedure
    search_date: '2026-09-12'
    search_note: >-
      Sought the union's rules on the decision calendar, on posthumous candidates, on withholding a
      medal when no candidate is found suitable, and on whether a decision may be appealed. The
      Statutes for the Fields Medal carry none of these; the union's statutes and by-laws pages
      returned HTTP 404 at the paths this audit tried.
    best_source: 1
    reason: >-
      Not reached, and not summarised. Four architecture elements that the Nobel anatomies carry -
      decision stages, posthumous rule, withholding and finality - are omitted here rather than written
      from general knowledge or inferred from the other award's design.
