audit_exceptions:
  - claim: architecture:funding_source
    search_date: '2026-09-12'
    search_note: >-
      The awarding society's award page, which carries the statement that financial support for the
      prize is provided by Google, returned HTTP 403 on this date. It was read at source during the
      Cycle 03 requalification of this system on 2026-09-11, and the claim is carried forward with that
      date stated rather than re-asserted as if freshly verified. No source read on either date gives
      the terms of the sponsorship.
    best_source: 1
    reason: "Read-at-source, dated. The funder is asserted; the terms of the arrangement are not."
  - claim: architecture:procedure
    search_date: '2026-09-12'
    search_note: >-
      Searched for the awarding society's nomination process, its advice for nominators and endorsers,
      its award-committee procedures, its Turing Award FAQ and its Turing Award committee page. All
      returned HTTP 403, on three separate society domains, as did the digital library. No non-society
      institutional source describing the procedure was found.
    best_source: 1
    reason: >-
      Not reached, and not summarised. Nine architecture elements are omitted rather than written from
      general knowledge, and the omission is stated on the page itself.
  - claim: archive-visibility
    search_date: '2026-09-12'
    search_note: >-
      Sought any published account of how far the award's own deliberation or nomination record is
      open. The society's committee page was unreachable, and no release horizon, secrecy rule or
      archive policy for this award was found at any record-grade source.
    best_source: 1
    reason: >-
      No archive layer is published on this page. The Nobel anatomies carry one because the Statutes
      state a fifty-year rule and the archive publishes a release horizon; nothing equivalent was
      reached here, so the layer is absent rather than asserted empty.
