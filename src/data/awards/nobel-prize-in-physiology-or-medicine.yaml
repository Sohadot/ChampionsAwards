title: Nobel Prize in Physiology or Medicine
slug: nobel-prize-in-physiology-or-medicine
status: published
last_reviewed: 2026-09-11
domain: biology-medicine
summary: An anatomy of one recognition system at the points where its record touches this corpus - the rules that govern the award, the dates those rules took effect, how far its own archive is open, and the three governed cases where its record is load-bearing.
introduction: This page maps an award, not a field. Seven of the ten governed biology cases rest on other institutions entirely; only three are decided in part by this apparatus, and only those three appear below.
legitimacy_question: "The question this page can answer is narrow: what do the award's own governing documents and its own archive establish about three specific cases? The question it cannot answer is why any committee decided as it did - the Statutes forbid disclosure of proposals, investigations and opinions, and release begins only fifty years after a decision."
structural_notes: "Biology adds a layer the physics page did not need. Two of the three cases here turn on when a rule took effect and on how far the archive is open, so the rules are dated and the archive's horizon is stated rather than assumed. Franklin is the test case: the prohibition on posthumous awards entered the Statutes in 1974 and cannot be applied to a decision taken in 1962."
architecture:
  granting_body: The Nobel Assembly at Karolinska Institutet, which has 50 members, selects the laureates from among the candidates recommended by the Nobel Committee for Physiology or Medicine.
  funding_source: >-
    The prize is paid from the fund established by Alfred Nobel's will and administered by the Nobel
    Foundation. The Statutes name no external, commercial or state sponsor, and the body that
    selects the laureates is not the body that holds the money. The mechanism by which the annual
    prize amount is set was not re-read by this audit - see the documented exception.
  governing_documents: The Statutes of the Nobel Foundation, together with the prize-specific regulations of the Nobel Assembly at Karolinska Institutet.
  eligibility: >-
    Candidates are those nominated by nominators invited by the Nobel Committee; no one may nominate
    themselves. The prize is awarded for a discovery of major importance in life science or medicine -
    lifetime achievement or scientific leadership cannot be considered.
  nomination_eligibility:
    - Members of the Nobel Assembly at Karolinska Institutet
    - Swedish and foreign members of the Medicine and Biology classes of the Royal Swedish Academy of Sciences
    - Nobel Prize laureates in physiology or medicine and in chemistry
    - Members of the Nobel Committee not qualified under the first category
    - Holders of established posts as full professors at the faculties of medicine in Sweden, and similar posts in Denmark, Finland, Iceland and Norway
    - Holders of similar posts at no fewer than six other faculties of medicine worldwide, selected by the Nobel Assembly with a view to distribution among countries
    - Scientists whom the Nobel Assembly may otherwise see fit to approach
  nomination: >-
    Nomination is by invitation only. The Nobel Committee sends confidential invitation letters -
    more than three thousand a year - in September, and completed forms must reach the Committee no
    later than 31 January of the following year. Under the Statutes, each year's adjudication embraces
    the nominations submitted in the preceding twelve months up to 1 February.
  selection_body: The Nobel Committee for Physiology or Medicine - five members and the Secretary of the Committee and Assembly - reviews the nominations and selects the candidates it recommends to the Assembly.
  decision_stages:
    - September - invitations to nominate are sent to qualified nominators
    - 31 January - deadline for submissions
    - March to May - the Committee commissions evaluation reports from international experts
    - June to August - evaluation work; reports submitted by mid-August
    - September - the Committee submits recommendations to the Assembly
    - First Monday in October - the Assembly chooses the laureates by majority vote and announces the decision
    - 10 December - the award ceremony in Stockholm
  sharing_rule: >-
    Under the Statutes, a prize amount may be divided equally between two works, and where a rewarded
    work has been produced by two or three persons the prize is awarded to them jointly. In no case may
    a prize amount be divided between more than three persons.
  posthumous_rule: >-
    Under the Statutes as they now stand, work produced by a person since deceased shall not be
    considered for an award; if a prizewinner dies before receiving the prize, the prize may still be
    presented. See the historical-rule layer below - this provision entered the Statutes in 1974.
  secrecy: >-
    Under the Statutes, proposals received for the award of a prize, and investigations and opinions
    concerning it, may not be divulged, and divergent opinions may not be recorded. A prize-awarding
    body may give third parties access to the materials behind a decision, but not until at least
    fifty years have elapsed from that decision.
  withholding: >-
    If none of the works under consideration is found to be of the importance the will intends, the
    prize money is reserved until the following year; if it cannot be awarded then either, the amount
    is added to the Foundation's restricted funds.
  finality: No appeals may be made against the decision of a prize-awarding body with regard to the award of a prize; the Assembly's decision is final and without appeal.
rule_history:
  - element: posthumous_rule
    current_rule: Work produced by a person since deceased shall not be considered for an award, unless death occurred after the announcement of the prize.
    effective_from: 1974
    predecessor_state: >-
      Partly known. The Nobel Foundation states that the prohibition entered the Statutes in 1974 and
      that before 1974 the prize had been awarded posthumously twice - to Erik Axel Karlfeldt in 1931
      and Dag Hammarskjoeld in 1961. The text of the provision that governed deceased candidates before
      1974 was not reached by this audit.
    record_anchor: [5]
    events_covered:
      - case: rosalind-franklin
        event_date: 1962
        established: false
        note: >-
          The rule in force in 1962 is not established. The modern prohibition postdates the decision
          by twelve years and is not applied to it here. This entry therefore records the 1962 outcome
          as an outcome, with no rule-based explanation attached.
  - element: sharing_rule
    current_rule: In no case may a prize amount be divided between more than three persons.
    predecessor_state: >-
      Unknown. The current Statutes carry this limit, but no dated source establishing when it entered
      them, or what preceded it, was reached by this audit.
    record_anchor: [1]
    events_covered:
      - case: albert-schatz
        event_date: 1952
        established: false
        note: >-
          The 1952 prize was awarded to one person, which is consistent with the modern limit but does
          not require it. No claim is made that a sharing limit bore on this outcome.
      - case: rosalind-franklin
        event_date: 1962
        established: false
        note: >-
          The 1962 prize was awarded to three people, the maximum the modern limit allows. Whether that
          limit was in force in 1962 is not established, so the corpus does not say that it constrained
          the decision.
archive_visibility:
  secrecy_rule: >-
    Nominations and the selection process are closed for fifty years from the decision, under the
    Statutes; the prize's own nomination page states the same rule.
  released_through: 1953
  as_of: '2026-09-11'
  record_anchor: [6]
  note: >-
    The release horizon is a moving fact and is stated with the date it was checked. For Physiology or
    Medicine the nomination archive currently publishes data only through 1953, which is earlier than
    the fifty-year rule alone would imply.
  case_status:
    - case: albert-schatz
      years: '1952'
      status: nomination-documented
      note: Nomination 84-0 for 1952 names Elisabeth Bugie, Albert Schatz and Selman Waksman together, and is published in the open archive.
      record_anchor: [7]
    - case: albert-schatz
      years: '1952'
      status: deliberation-not-reached
      note: >-
        No deliberation record for this nomination was reached by this audit, and no committee
        rationale is therefore asserted. The Statutes restrict disclosure of proposals, investigations
        and opinions, while permitting a prize-awarding body to give third parties access to the
        materials behind a decision once fifty years have passed - so this records what was reached,
        not what exists.
      record_anchor: [1]
    - case: oswald-avery
      years: 1932-1953
      status: nomination-documented
      note: The archive records Avery as a nominee in 38 nominations - 37 for Physiology or Medicine between 1932 and 1953, and one for Chemistry in 1957.
      record_anchor: [8]
    - case: oswald-avery
      years: after 1953
      status: archive-year-not-released
      note: Avery died in 1955; any nomination in 1954 or 1955 falls in years the Medicine archive has not released, so absence cannot be inferred for them.
      record_anchor: [6]
    - case: rosalind-franklin
      years: 1954-1962
      status: archive-year-not-released
      note: >-
        Neither Franklin's lifetime years nor the 1962 award year are open in the Medicine nomination
        archive. Whether she was ever nominated is therefore not a question this corpus can answer -
        which is different from finding that she was not.
      record_anchor: [6]
    - case: rosalind-franklin
      years: '1962'
      status: deliberation-not-reached
      note: >-
        No deliberation record for the 1962 decision was reached by this audit, so no reason for the
        composition of that year's award is asserted here. Disclosure is restricted under the
        Statutes and may be granted at the awarding body's discretion after fifty years.
      record_anchor: [1]
key_facts:
  - fact: The Nobel Assembly at Karolinska Institutet has 50 members and chooses the laureates by majority vote on the first Monday in October; the decision is final and without appeal.
    source: 2
  - fact: More than three thousand confidential invitations to nominate are sent each September, and completed nominations must reach the Committee by 31 January.
    source: 2
  - fact: The Nobel Foundation states that the prohibition on posthumous awards entered the Statutes in 1974, and that two prizes had been awarded posthumously before then - in 1931 and 1961.
    source: 5
  - fact: The nomination archive currently publishes Physiology or Medicine nominations only through 1953.
    source: 6
