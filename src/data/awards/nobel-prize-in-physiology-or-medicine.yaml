audit_exceptions:
  - claim: architecture:funding_source
    search_date: '2026-09-12'
    search_note: >-
      Re-read of the Nobel Foundation's own page on how the prizes are funded was attempted on this
      date and returned HTTP 403 to this audit, as did the foundation's other pages. The claim stated
      here - that the prize is paid from the fund created by Alfred Nobel's will and administered by
      the Nobel Foundation, with no external sponsor named in the governing documents - rests on the
      Statutes and the will, which are the governing documents already cited by this entry.
    best_source: 1
    reason: >-
      Governing-document-sufficient. What is asserted is the absence of an external sponsor in the
      rules, which the governing documents carry. The mechanism that sets the annual amount is not
      asserted, because the page describing it was not reached.
