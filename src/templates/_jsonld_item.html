{% set type_map = {
  "unawarded": "Person",
  "concepts": "DefinedTerm",
  "awards": "CreativeWork",
  "recognition-systems": "Organization",
  "sectors": "Thing",
  "rankings": "ItemList",
  "reports": "Report",
  "timeline": "Thing"
} %}
<script type="application/ld+json">
{{
  {
    "@context": "https://schema.org",
    "@type": type_map.get(item.cluster, "Thing"),
    "name": item.title,
    "description": item.summary,
    "url": item.canonical_url,
    "isPartOf": {"@type": "WebSite", "name": site.site_name, "url": site.domain}
  } | tojson
}}
</script>
