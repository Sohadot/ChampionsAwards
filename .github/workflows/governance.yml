# ChampionsAwards - Governed Admission Pipeline, CI v1
#
# One job, deliberately. A matrix, caches and parallel jobs would each add a way
# for the gate to be green for a reason unrelated to the corpus, and the point of
# this workflow is that its green means exactly one thing: these sources, built
# from nothing in this run, passed every governed check against the output of
# that same build.
#
# This file makes the checks automatic. It does NOT make them binding - that
# takes repository settings, which cannot live in a file: main protected, changes
# only through a pull request, this job ("Governed admission checks") a required
# status check, and no bypass. From 2026-09-14 to 2026-09-30 none of that was set
# and this job was a detector. Since 2026-09-30 all of it is, which PR #1 proved by
# going from mergeable_state 'unstable' to 'blocked'. A layer is 'required' in the
# GAP registry only where a control it names actually runs, and can fail, below.
name: governance

on:
  pull_request:
    branches: [main]
  # Also on push, so a commit landing on main is visible. Visibility is not
  # admission: branch protection is what decides, by refusing the merge.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governed admission checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned dependencies
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Prove the build output is absent before we build it
        # public/ and reports/ are gitignored, so a clean checkout must not
        # contain them. If either exists here, something committed generated
        # output and every later check would be reading someone else's build.
        run: |
          set -euo pipefail
          for d in public reports; do
            if [ -e "$d" ]; then
              echo "::error::$d exists in a clean checkout - generated output must never be committed"
              exit 1
            fi
          done
          echo "clean: no build output present"

      - name: Build from source
        run: python scripts/build.py

      - name: Run governed checks against this run's build
        run: python scripts/run_checks.py

      - name: Admission pipeline coverage (report, not a gate)
        if: always()
        run: python scripts/gap_status.py
